{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
  <title>Forgot Password - PrintMax</title>
  <meta name="description" content="Reset your vendor password securely">
  
  <!-- Favicon -->
  <link rel="icon" type="image/x-icon" href="{% static 'favicon.ico' %}">
  <link rel="icon" type="image/png" sizes="16x16" href="{% static 'favicon-16x16.png' %}">
  <link rel="icon" type="image/png" sizes="32x32" href="{% static 'favicon-32x32.png' %}">
  <link rel="apple-touch-icon" sizes="180x180" href="{% static 'apple-touch-icon.png' %}">
  <link rel="manifest" href="{% static 'site.webmanifest' %}">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      /* Color System */
      --primary: #1e3a8a;
      --primary-variant: #1e40af;
      --primary-light: #dbeafe;
      --secondary: #10b981;
      --secondary-variant: #059669;
      --accent: #7c3aed;
      --accent-light: #f3f4f6;
      --success: #10b981;
      --warning: #f59e0b;
      --error: #ef4444;
      --info: #3b82f6;

      /* Background Colors */
      --background: #f8fafc;
      --background-solid: #ffffff;
      --surface: #ffffff;
      --surface-variant: #f1f5f9;
      --surface-elevated: #ffffff;

      /* Text Colors */
      --on-primary: #ffffff;
      --on-secondary: #ffffff;
      --on-background: #1f2937;
      --on-surface: #1f2937;
      --on-surface-variant: #6b7280;

      /* Border & Outline */
      --outline: #e5e7eb;
      --outline-variant: #f3f4f6;

      /* Gradients */
      --gradient-primary: linear-gradient(135deg, #1e3a8a 0%, #3b82f6 100%);
      --gradient-secondary: linear-gradient(135deg, #10b981 0%, #059669 100%);
      --gradient-accent: linear-gradient(135deg, #7c3aed 0%, #8b5cf6 100%);
      --gradient-surface: linear-gradient(135deg, #ffffff 0%, #f9fafb 100%);
      --gradient-header: linear-gradient(135deg, #1e3a8a 0%, #1e40af 100%);

      /* Border radius */
      --radius-xs: 4px;
      --radius-sm: 6px;
      --radius-md: 8px;
      --radius-lg: 12px;
      --radius-xl: 16px;
      --radius-2xl: 20px;

      /* Shadows */
      --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
      --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
      --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
      --shadow-xl: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);

      /* Transitions */
      --transition-fast: 0.15s cubic-bezier(0.4, 0.0, 0.2, 1);
      --transition-standard: 0.3s cubic-bezier(0.4, 0.0, 0.2, 1);
      --transition-slow: 0.5s cubic-bezier(0.4, 0.0, 0.2, 1);
    }

    [data-theme="dark"] {
      --primary: #60a5fa;
      --primary-variant: #3b82f6;
      --primary-light: #1e293b;
      --secondary: #34d399;
      --secondary-variant: #10b981;
      --accent: #a78bfa;
      --accent-light: #1f2937;
      --background: #111827;
      --background-solid: #111827;
      --surface: #1f2937;
      --surface-variant: #374151;
      --surface-elevated: #374151;
      --on-primary: #000000;
      --on-secondary: #000000;
      --on-background: #f9fafb;
      --on-surface: #f9fafb;
      --on-surface-variant: #d1d5db;
      --outline: #374151;
      --outline-variant: #4b5563;
      --gradient-header: linear-gradient(135deg, #111827 0%, #1f2937 100%);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--background);
      color: var(--on-background);
      line-height: 1.6;
      transition: all var(--transition-standard);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }

    .forgot-password-container {
      width: 100%;
      max-width: 480px;
      background: var(--surface);
      border-radius: var(--radius-xl);
      box-shadow: var(--shadow-xl);
      border: 1px solid var(--outline);
      overflow: hidden;
      position: relative;
    }

    .forgot-password-header {
      background: var(--gradient-header);
      padding: 2rem;
      text-align: center;
      color: var(--on-primary);
    }

    .header-icon {
      width: 64px;
      height: 64px;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 1rem;
      font-size: 1.5rem;
      backdrop-filter: blur(10px);
    }

    .header-title {
      font-size: 1.5rem;
      font-weight: 700;
      margin-bottom: 0.5rem;
      letter-spacing: -0.025em;
    }

    .header-subtitle {
      font-size: 0.9rem;
      opacity: 0.9;
      font-weight: 400;
    }

    .forgot-password-body {
      padding: 2rem;
    }

    .form-group {
      margin-bottom: 1.5rem;
    }

    .form-label {
      display: block;
      font-size: 0.875rem;
      font-weight: 600;
      color: var(--on-surface);
      margin-bottom: 0.5rem;
    }

    .form-input {
      width: 100%;
      padding: 0.875rem 1rem;
      border: 2px solid var(--outline);
      border-radius: var(--radius-lg);
      font-size: 1rem;
      background: var(--surface);
      color: var(--on-surface);
      transition: all var(--transition-fast);
      font-family: inherit;
    }

    .form-input:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px var(--primary-light);
    }

    .form-input::placeholder {
      color: var(--on-surface-variant);
    }

    .btn {
      width: 100%;
      padding: 0.875rem 1.5rem;
      border: none;
      border-radius: var(--radius-lg);
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all var(--transition-fast);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      font-family: inherit;
      position: relative;
      overflow: hidden;
    }

    .btn-primary {
      background: var(--gradient-primary);
      color: var(--on-primary);
      box-shadow: var(--shadow-sm);
    }

    .btn-primary:hover {
      transform: translateY(-1px);
      box-shadow: var(--shadow-md);
    }

    .btn-primary:active {
      transform: translateY(0);
    }

    .btn-primary:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    .btn-secondary {
      background: var(--surface-variant);
      color: var(--on-surface);
      border: 1px solid var(--outline);
    }

    .btn-secondary:hover {
      background: var(--outline-variant);
    }

    .back-to-login {
      text-align: center;
      margin-top: 1.5rem;
      padding-top: 1.5rem;
      border-top: 1px solid var(--outline-variant);
    }

    .back-to-login a {
      color: var(--primary);
      text-decoration: none;
      font-weight: 600;
      transition: color var(--transition-fast);
    }

    .back-to-login a:hover {
      color: var(--primary-variant);
    }

    .alert {
      padding: 1rem;
      border-radius: var(--radius-lg);
      margin-bottom: 1rem;
      font-size: 0.875rem;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .alert-success {
      background: #ecfdf5;
      color: #065f46;
      border: 1px solid #a7f3d0;
    }

    .alert-error {
      background: #fef2f2;
      color: #991b1b;
      border: 1px solid #fecaca;
    }

    .alert-info {
      background: #eff6ff;
      color: #1e40af;
      border: 1px solid #bfdbfe;
    }

    .loading-spinner {
      display: inline-block;
      width: 16px;
      height: 16px;
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-radius: 50%;
      border-top-color: #fff;
      animation: spin 1s ease-in-out infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .steps-container {
      margin-bottom: 2rem;
    }

    .step {
      display: flex;
      align-items: center;
      gap: 1rem;
      padding: 1rem;
      border-radius: var(--radius-lg);
      background: var(--surface-variant);
      margin-bottom: 1rem;
      transition: all var(--transition-fast);
    }

    .step.active {
      background: var(--primary-light);
      border: 1px solid var(--primary);
    }

    .step.completed {
      background: #ecfdf5;
      border: 1px solid var(--success);
    }

    .step-number {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 0.875rem;
      background: var(--outline);
      color: var(--on-surface-variant);
    }

    .step.active .step-number {
      background: var(--primary);
      color: var(--on-primary);
    }

    .step.completed .step-number {
      background: var(--success);
      color: var(--on-secondary);
    }

    .step-content h4 {
      font-size: 0.875rem;
      font-weight: 600;
      margin-bottom: 0.25rem;
    }

    .step-content p {
      font-size: 0.75rem;
      color: var(--on-surface-variant);
    }

    @media (max-width: 480px) {
      .forgot-password-container {
        margin: 0;
        border-radius: 0;
        min-height: 100vh;
      }
      
      .forgot-password-header,
      .forgot-password-body {
        padding: 1.5rem;
      }
    }
  </style>
</head>
<body>
  <div class="forgot-password-container">
    <div class="forgot-password-header">
      <div class="header-icon">
        <i class="fas fa-lock"></i>
      </div>
      <h1 class="header-title">Forgot Password</h1>
      <p class="header-subtitle">Reset your vendor account password</p>
    </div>

    <div class="forgot-password-body">
      <!-- Step 1: Email Input -->
      <div id="step1" class="step active">
        <div class="step-number">1</div>
        <div class="step-content">
          <h4>Enter Email</h4>
          <p>Provide your registered vendor email address</p>
        </div>
      </div>

      <!-- Step 2: Verification -->
      <div id="step2" class="step">
        <div class="step-number">2</div>
        <div class="step-content">
          <h4>Verify Email</h4>
          <p>Check your email for verification code</p>
        </div>
      </div>

      <!-- Step 3: New Password -->
      <div id="step3" class="step">
        <div class="step-number">3</div>
        <div class="step-content">
          <h4>Set New Password</h4>
          <p>Create a strong new password</p>
        </div>
      </div>

      <!-- Alert Messages -->
      <div id="alertContainer"></div>

      <!-- Step 1 Form: Email Input -->
      <form id="emailForm" class="step-form">
        <div class="form-group">
          <label for="email" class="form-label">Vendor Email Address</label>
          <input type="email" id="email" name="email" class="form-input" placeholder="Enter your registered email" required>
        </div>
        <button type="submit" class="btn btn-primary" id="sendCodeBtn">
          <i class="fas fa-paper-plane"></i>
          Send Reset Code
        </button>
      </form>

      <!-- Step 2 Form: Verification Code -->
      <form id="verificationForm" class="step-form" style="display: none;">
        <div class="form-group">
          <label for="verificationCode" class="form-label">Verification Code</label>
          <input type="text" id="verificationCode" name="verificationCode" class="form-input" placeholder="Enter 6-digit code" maxlength="6" required>
        </div>
        <div id="otp-timer" style="margin-bottom: 1rem; color: #3a86ff; font-weight: 600; text-align:center;"></div>
        <button type="submit" class="btn btn-primary" id="verifyCodeBtn">
          <i class="fas fa-check"></i>
          Verify Code
        </button>
        <button type="button" class="btn btn-secondary" id="resendCodeBtn" style="margin-top: 0.5rem;">
          <i class="fas fa-redo"></i>
          Resend Code
        </button>
      </form>

      <!-- Step 3 Form: New Password -->
      <form id="passwordForm" class="step-form" style="display: none;">
        <div class="form-group">
          <label for="newPassword" class="form-label">New Password</label>
          <div style="position:relative;">
            <input type="password" id="newPassword" name="newPassword" class="form-input" placeholder="Enter new password" required>
            <span class="toggle-password" id="toggleNewPassword" style="position:absolute; right:10px; top:50%; transform:translateY(-50%); cursor:pointer;">
              <i class="fas fa-eye"></i>
            </span>
          </div>
        </div>
        <div class="form-group">
          <label for="confirmPassword" class="form-label">Confirm Password</label>
          <div style="position:relative;">
            <input type="password" id="confirmPassword" name="confirmPassword" class="form-input" placeholder="Confirm new password" required>
            <span class="toggle-password" id="toggleConfirmPassword" style="position:absolute; right:10px; top:50%; transform:translateY(-50%); cursor:pointer;">
              <i class="fas fa-eye"></i>
            </span>
          </div>
        </div>
        <button type="submit" class="btn btn-primary" id="resetPasswordBtn">
          <i class="fas fa-key"></i>
          Reset Password
        </button>
      </form>

      <div class="back-to-login">
        <a href="/vendor-login/">
          <i class="fas fa-arrow-left"></i>
          Back to Login
        </a>
      </div>
    </div>
  </div>

  <script>
    let currentStep = 1;
    let userEmail = '';
    let verificationCode = '';

    // Helper function to show alerts
    function showAlert(message, type = 'info') {
      const alertContainer = document.getElementById('alertContainer');
      const alert = document.createElement('div');
      alert.className = `alert alert-${type}`;
      alert.innerHTML = `
        <i class="fas fa-${type === 'success' ? 'check-circle' : type === 'error' ? 'exclamation-circle' : 'info-circle'}"></i>
        ${message}
      `;
      alertContainer.innerHTML = '';
      alertContainer.appendChild(alert);
      
      // Auto-hide after 5 seconds
      setTimeout(() => {
        alert.remove();
      }, 5000);
    }

    // Helper function to update steps
    function updateSteps(step) {
      // Reset all steps
      document.querySelectorAll('.step').forEach((s, index) => {
        s.classList.remove('active', 'completed');
        if (index + 1 < step) {
          s.classList.add('completed');
        } else if (index + 1 === step) {
          s.classList.add('active');
        }
      });
    }

    // Helper function to show/hide forms
    function showForm(formId) {
      document.querySelectorAll('.step-form').forEach(form => {
        form.style.display = 'none';
      });
      document.getElementById(formId).style.display = 'block';
    }

    // Helper function to start OTP timer
    let otpTimerInterval;
    function startOtpTimer(durationSeconds) {
      clearInterval(otpTimerInterval);
      let timer = durationSeconds;
      const timerDisplay = document.getElementById('otp-timer');
      function updateDisplay() {
        const minutes = Math.floor(timer / 60);
        const seconds = timer % 60;
        timerDisplay.textContent = `OTP expires in ${minutes}:${seconds.toString().padStart(2, '0')}`;
      }
      updateDisplay();
      otpTimerInterval = setInterval(() => {
        timer--;
        if (timer < 0) {
          clearInterval(otpTimerInterval);
          timerDisplay.textContent = 'OTP expired. Please resend code.';
        } else {
          updateDisplay();
        }
      }, 1000);
    }

    // Email form submission
    document.getElementById('emailForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value;
      const btn = document.getElementById('sendCodeBtn');
      
      btn.disabled = true;
      btn.innerHTML = '<span class="loading-spinner"></span> Sending...';
      
      try {
        const response = await fetch('/forgot-password-api/', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'X-CSRFToken': document.querySelector('[name=csrfmiddlewaretoken]').value
          },
          body: JSON.stringify({ email: email })
        });
        
        const data = await response.json();
        
        if (data.success) {
          userEmail = email;
          showAlert('Verification code sent to your email!', 'success');
          currentStep = 2;
          updateSteps(currentStep);
          showForm('verificationForm');
          startOtpTimer(120); // 2 minutes
        } else {
          showAlert(data.error || 'Failed to send verification code', 'error');
        }
      } catch (error) {
        showAlert('Network error. Please try again.', 'error');
      } finally {
        btn.disabled = false;
        btn.innerHTML = '<i class="fas fa-paper-plane"></i> Send Reset Code';
      }
    });

    // Verification form submission
    document.getElementById('verificationForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const code = document.getElementById('verificationCode').value;
      const btn = document.getElementById('verifyCodeBtn');
      
      btn.disabled = true;
      btn.innerHTML = '<span class="loading-spinner"></span> Verifying...';
      
      try {
        const response = await fetch('/verify-reset-code/', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'X-CSRFToken': document.querySelector('[name=csrfmiddlewaretoken]').value
          },
          body: JSON.stringify({ 
            email: userEmail,
            code: code 
          })
        });
        
        const data = await response.json();
        
        if (data.success) {
          verificationCode = code;
          showAlert('Code verified successfully!', 'success');
          currentStep = 3;
          updateSteps(currentStep);
          showForm('passwordForm');
        } else {
          showAlert(data.error || 'Invalid verification code', 'error');
        }
      } catch (error) {
        showAlert('Network error. Please try again.', 'error');
      } finally {
        btn.disabled = false;
        btn.innerHTML = '<i class="fas fa-check"></i> Verify Code';
      }
    });

    // Resend code button
    document.getElementById('resendCodeBtn').addEventListener('click', async () => {
      const btn = document.getElementById('resendCodeBtn');
      
      btn.disabled = true;
      btn.innerHTML = '<span class="loading-spinner"></span> Sending...';
      
      try {
        const response = await fetch('/forgot-password-api/', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'X-CSRFToken': document.querySelector('[name=csrfmiddlewaretoken]').value
          },
          body: JSON.stringify({ email: userEmail })
        });
        
        const data = await response.json();
        
        if (data.success) {
          showAlert('New verification code sent!', 'success');
          startOtpTimer(120); // restart timer for 2 minutes
        } else {
          showAlert(data.error || 'Failed to resend code', 'error');
        }
      } catch (error) {
        showAlert('Network error. Please try again.', 'error');
      } finally {
        btn.disabled = false;
        btn.innerHTML = '<i class="fas fa-redo"></i> Resend Code';
      }
    });

    // Password form submission
    document.getElementById('passwordForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const newPassword = document.getElementById('newPassword').value;
      const confirmPassword = document.getElementById('confirmPassword').value;
      const btn = document.getElementById('resetPasswordBtn');
      
      if (newPassword !== confirmPassword) {
        showAlert('Passwords do not match', 'error');
        return;
      }
      
      if (newPassword.length < 8) {
        showAlert('Password must be at least 8 characters long', 'error');
        return;
      }
      
      btn.disabled = true;
      btn.innerHTML = '<span class="loading-spinner"></span> Resetting...';
      
      try {
        const response = await fetch('/reset-password/', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'X-CSRFToken': document.querySelector('[name=csrfmiddlewaretoken]').value
          },
          body: JSON.stringify({ 
            email: userEmail,
            code: verificationCode,
            new_password: newPassword 
          })
        });
        
        const data = await response.json();
        
        if (data.success) {
          showAlert('Password reset successfully! Redirecting to login...', 'success');
          // Clear password fields
          document.getElementById('newPassword').value = '';
          document.getElementById('confirmPassword').value = '';
          // Disable password fields and icons
          document.getElementById('newPassword').disabled = true;
          document.getElementById('confirmPassword').disabled = true;
          document.getElementById('toggleNewPassword').style.pointerEvents = 'none';
          document.getElementById('toggleNewPassword').style.opacity = '0.5';
          document.getElementById('toggleConfirmPassword').style.pointerEvents = 'none';
          document.getElementById('toggleConfirmPassword').style.opacity = '0.5';
          setTimeout(() => {
            window.location.href = '/';
          }, 2000);
        } else {
          showAlert(data.error || 'Failed to reset password', 'error');
        }
      } catch (error) {
        showAlert('Network error. Please try again.', 'error');
      } finally {
        btn.disabled = false;
        btn.innerHTML = '<i class="fas fa-key"></i> Reset Password';
      }
    });

    // Password show/hide toggles
    document.getElementById('toggleNewPassword').addEventListener('click', function() {
      const input = document.getElementById('newPassword');
      const icon = this.querySelector('i');
      if (input.disabled) return;
      if (input.type === 'password') {
        input.type = 'text';
        icon.classList.remove('fa-eye');
        icon.classList.add('fa-eye-slash');
      } else {
        input.type = 'password';
        icon.classList.remove('fa-eye-slash');
        icon.classList.add('fa-eye');
      }
    });
    document.getElementById('toggleConfirmPassword').addEventListener('click', function() {
      const input = document.getElementById('confirmPassword');
      const icon = this.querySelector('i');
      if (input.disabled) return;
      if (input.type === 'password') {
        input.type = 'text';
        icon.classList.remove('fa-eye');
        icon.classList.add('fa-eye-slash');
      } else {
        input.type = 'password';
        icon.classList.remove('fa-eye-slash');
        icon.classList.add('fa-eye');
      }
    });

    // Auto-format verification code input
    document.getElementById('verificationCode').addEventListener('input', (e) => {
      e.target.value = e.target.value.replace(/\D/g, '').slice(0, 6);
    });
  </script>

  <!-- CSRF Token -->
  {% csrf_token %}
</body>
</html>
