<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="user-email" content="{{ user.email|default:'anonymous' }}">
    <title>Photo Print Service</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: #e8ecf5;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .modal-bg {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.35);
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .card-modal {
            background: #fff;
            border-radius: 16px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.18);
            max-width: 600px;
            min-width: 400px;
            width: 100%;
            max-height: 98vh;
            min-height: 700px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .modal-header {
            background: #2563eb;
            color: #fff;
            padding: 22px 32px 12px 32px;
            border-radius: 16px 16px 0 0;
            text-align: center;
        }
        .modal-header h1 {
            font-size: 1.4rem;
            margin-bottom: 4px;
        }
        .modal-header p {
            font-size: 1rem;
            color: #dbeafe;
        }
        .modal-content {
            flex: 1;
            overflow-y: auto;
            padding: 24px 32px 0 32px;
            background: #f8fafc;
            min-height: 400px;
            display: flex;
            flex-direction: row;
            gap: 24px;
        }
        .left-panel {
            flex: 1.2;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding-right: 10px;
        }
        .right-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 20px;
            justify-content: flex-start;
            padding-left: 10px;
        }
        .right-panel .form-group {
            margin-bottom: 16px;
        }
        .right-panel label {
            font-size: 1rem;
            color: #222;
            margin-bottom: 4px;
            display: block;
        }
        .right-panel select, .right-panel input[type=number] {
            width: 100%;
            padding: 10px 10px;
            border-radius: 5px;
            border: 1px solid #d1d5db;
            font-size: 1rem;
            background: #fff;
            margin-top: 2px;
        }
        .upload-btn {
            background: #2563eb;
            color: #fff;
            border: none;
            padding: 12px 0;
            border-radius: 6px;
            cursor: pointer;
            font-size: 1rem;
            width: 100%;
            margin-bottom: 12px;
            transition: background 0.2s;
        }
        .upload-btn:hover {
            background: #1d4ed8;
        }
        .photos-count {
            font-size: 1rem;
            color: #222;
            text-align: right;
            margin-bottom: 8px;
        }
        .thumbnails-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            margin-bottom: 18px;
        }
        .thumb {
            position: relative;
            width: 60px;
            height: 60px;
            border-radius: 6px;
            overflow: hidden;
            background: #f1f5f9;
            box-shadow: 0 1px 4px rgba(0,0,0,0.04);
        }
        .thumb img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .remove-thumb {
            position: absolute;
            top: 2px;
            right: 2px;
            background: #ef4444;
            color: #fff;
            border: none;
            border-radius: 50%;
            width: 18px;
            height: 18px;
            font-size: 13px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2;
        }
        .layout-row {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin: 10px 0 18px 0;
        }
        .layout-btn {
            background: #f1f5f9;
            border: 1.5px solid #d1d5db;
            color: #2563eb;
            border-radius: 5px;
            padding: 7px 13px;
            font-size: 1rem;
            cursor: pointer;
            transition: background 0.2s, border 0.2s;
        }
        .layout-btn.active, .layout-btn:focus {
            background: #2563eb;
            color: #fff;
            border-color: #2563eb;
        }
        .shop-row, .orientation-row {
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 0 0 10px 0;
        }
        .shop-row label, .orientation-row label {
            font-size: 1rem;
            color: #222;
            min-width: 70px;
        }
        .shop-row select, .orientation-row select {
            flex: 1;
            padding: 7px 8px;
            border-radius: 5px;
            border: 1px solid #d1d5db;
            font-size: 1rem;
        }
        .preview-section {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 340px;
            margin: 0 0 18px 0;
        }
        .a4-canvas {
            background: #fff;
            border: 1.5px solid #e5e7eb;
            border-radius: 6px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
            width: 420px;
            height: 600px;
            max-width: 100%;
            max-height: 100%;
            display: block;
            margin-top: 8px;
        }
        .footer-controls {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 24px;
            padding: 20px 32px 20px 32px;
            background: #f1f5f9;
            border-top: 1px solid #e5e7eb;
            position: sticky;
            bottom: 0;
            z-index: 2;
        }
        .footer-controls select, .footer-controls input[type=number] {
            padding: 6px 8px;
            border-radius: 5px;
            border: 1px solid #d1d5db;
            font-size: 1rem;
        }
        .footer-controls label {
            font-size: 1rem;
            color: #222;
            margin-right: 4px;
        }
        .print-btn {
            background: #2563eb;
            color: #fff;
            border: none;
            border-radius: 6px;
            padding: 10px 28px;
            font-size: 1.1rem;
            cursor: pointer;
            margin-left: auto;
            transition: background 0.2s;
            box-shadow: 0 2px 8px rgba(37,99,235,0.08);
            font-weight: 600;
            min-width: 110px;
        }
        .print-btn:disabled {
            background: #bcd0fa;
            color: #fff;
            cursor: not-allowed;
        }
        .print-btn:hover:not(:disabled) {
            background: #1746a2;
        }
        .cancel-btn {
            background: #222;
            color: #fff;
            border: none;
            border-radius: 6px;
            padding: 10px 18px;
            font-size: 1.1rem;
            cursor: pointer;
            margin-right: 8px;
            transition: background 0.2s;
            min-width: 110px;
        }
        .cancel-btn:hover {
            background: #111;
        }
        .calculate-btn {
            background: #059669;
            color: #fff;
            border: none;
            border-radius: 6px;
            padding: 10px 18px;
            font-size: 1.1rem;
            cursor: pointer;
            margin-right: 8px;
            transition: background 0.2s;
            min-width: 110px;
        }
        .calculate-btn:hover {
            background: #047857;
        }
        .calculate-btn:disabled {
            background: #9ca3af;
            cursor: not-allowed;
        }
        .pricing-summary {
            background: linear-gradient(135deg, #f0f4f8 0%, #e0e7ef 100%);
            border-radius: 14px;
            box-shadow: 0 2px 12px rgba(80, 120, 200, 0.08);
            padding: 24px 28px 18px 28px;
            margin-top: 18px;
            max-width: 420px;
            margin-left: auto;
            margin-right: auto;
            border: 1px solid #e2e8f0;
            transition: box-shadow 0.2s;
        }
        .pricing-summary h3 {
            margin: 0 0 18px 0;
            color: #2563eb;
            font-size: 1.25rem;
            font-weight: 600;
            letter-spacing: 0.01em;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .pricing-summary h3 i {
            color: #059669;
            font-size: 1.2em;
        }
        .pricing-breakdown-list {
            margin: 0;
            padding: 0;
            list-style: none;
        }
        .pricing-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid #e5e7eb;
            font-size: 1.05rem;
        }
        .pricing-item:last-child {
            border-bottom: none;
        }
        .pricing-label {
            color: #475569;
            font-weight: 500;
        }
        .pricing-value {
            color: #1e293b;
            font-weight: 600;
        }
        .pricing-item.total {
            font-size: 1.18rem;
            color: #059669;
            font-weight: 700;
            background: #e0f7ef;
            border-radius: 6px;
            margin-top: 10px;
            padding: 14px 0;
            border-bottom: none;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .pricing-item.total .fa-check-circle {
            color: #059669;
            font-size: 1.2em;
        }
        /* Shop dropdown (matches dashboard modal styling) */
        .shop-dropdown2 { position: relative; width: 100%; }
        .shop-trigger { display:flex; align-items:center; justify-content:space-between; width:100%; background:#fff; border:1px solid #e5e7eb; padding:12px; border-radius:10px; box-shadow: 0 1px 2px rgba(0,0,0,.04); cursor:pointer; }
        .shop-trigger-label { display:flex; align-items:center; gap:10px; min-width:0; }
        .shop-trigger .shop-avatar { width:28px; height:28px; border-radius:50%; display:flex; align-items:center; justify-content:center; background:#eef2ff; color:#4f46e5; }
        .shop-trigger .shop-title { font-weight:600; color:#111827; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
        .shop-trigger .shop-subtitle { font-size:12px; color:#6b7280; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
        .shop-caret { color:#6b7280; }
        .shop-panel { position:fixed; background:#fff; border:1px solid #e5e7eb; border-radius:12px; box-shadow:0 12px 24px rgba(0,0,0,.18); padding:10px; z-index:99999; display:none; max-height:45vh; overflow:auto; max-width:420px; width:auto; overscroll-behavior:contain; }
        .shop-panel.open { display:block; }
        .shop-list { display:grid; gap:8px; }
        .shop-card { display:flex; align-items:center; background:#fff; border:1px solid #e5e7eb; border-radius:10px; padding:10px; box-shadow:0 1px 2px rgba(0,0,0,.04); transition: box-shadow .2s, transform .2s; }
        .shop-card:hover { box-shadow: 0 4px 14px rgba(0,0,0,.08); transform: translateY(-1px); }
        .shop-card.selected { outline: 2px solid #2563eb; background:#f0f7ff; }
        .shop-card-left { margin-right:10px; }
        .shop-avatar { width:36px; height:36px; border-radius:50%; display:flex; align-items:center; justify-content:center; background:#eef2ff; color:#4f46e5; }
        .shop-card-body { flex:1; min-width:0; }
        .shop-name { font-weight:600; color:#111827; white-space:normal; overflow:visible; }
        .shop-address { font-size:12px; color:#6b7280; white-space:normal; overflow:visible; }
        .shop-meta { font-size:12px; color:#2563eb; margin-top:2px; display:flex; align-items:center; gap:6px; }
        @media (max-width: 800px) {
            .card-modal {
                max-width: 99vw;
                min-width: unset;
                padding: 0 0 10px 0;
            }
            .modal-content {
                flex-direction: column;
                gap: 0;
                padding: 18px 8px 0 8px;
            }
            .left-panel, .right-panel {
                width: 100%;
                min-width: 0;
                flex: unset;
                padding: 0;
            }
            .right-panel {
                margin-top: 18px;
            }
            .footer-controls {
                padding: 16px 8px 16px 8px;
            }
        }
    </style>
</head>
<body>
<div class="modal-bg">
    <div class="card-modal">
        <div class="modal-header">
            <h1>Photo Print Service</h1>
            <p>Upload your photos, select layout, and print instantly!</p>
        </div>
        <div class="modal-content">
            <div class="left-panel">
                <button class="upload-btn" id="uploadBtn">Upload Photos</button>
                <input type="file" id="fileInput" accept="image/*" multiple style="display:none;">
                <div class="photos-count" id="photosCount">0 photos uploaded</div>
                <div class="thumbnails-grid" id="thumbnailsGrid"></div>
                <div class="layout-row">
                    <button class="layout-btn active" data-layout="1">1</button>
                    <button class="layout-btn" data-layout="2">2</button>
                    <button class="layout-btn" data-layout="4">4</button>
                    <button class="layout-btn" data-layout="6">6</button>
                    <button class="layout-btn" data-layout="9">9</button>
                </div>
                <div class="preview-section">
                    <canvas id="a4Canvas" class="a4-canvas" width="420" height="600"></canvas>
                </div>
            </div>
            <div class="right-panel">
                <div class="form-group">
                    <label for="orientation">Orientation:</label>
                    <select id="orientation">
                        <option value="portrait">Portrait</option>
                        <option value="landscape">Landscape</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="shopSelect">Shop:</label>
                    <input type="hidden" id="shopSelect" value="" />
                    <div class="shop-dropdown2" id="photo-shop-dropdown">
                        <button type="button" class="shop-trigger" id="photo-shop-trigger">
                            <div class="shop-trigger-label">
                                <div class="shop-avatar"><i class="fas fa-store"></i></div>
                                <div style="display:flex; flex-direction:column; min-width:0;">
                                    <span class="shop-title">Select Shop</span>
                                    <span class="shop-subtitle">Name • Address • Distance</span>
                                </div>
                            </div>
                            <i class="fas fa-chevron-down shop-caret"></i>
                        </button>
                        <div class="shop-panel" id="photo-shop-panel">
                            <div class="shop-list" id="photo-shop-list"></div>
                        </div>
                    </div>
                </div>
                <div class="form-group">
                    <label for="color">Color:</label>
                    <select id="color">
                                        <option value="Color">Color</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="copies">Copies:</label>
                    <input type="number" id="copies" value="1" min="1" max="50" style="width:100%;">
                </div>
                <div class="pricing-summary" id="pricingSummary" style="display: none;">
                    <h3><i class="fas fa-receipt"></i> Pricing Summary</h3>
                    <ul class="pricing-breakdown-list" id="pricingDetails"></ul>
                </div>
            </div>
        </div>
        <div class="footer-controls">
            <button class="cancel-btn" id="cancelBtn">Cancel</button>
            <button class="calculate-btn" id="calculateBtn">Calculate Price</button>
            <button class="print-btn" id="printBtn" disabled>Print</button>
        </div>
    </div>
</div>
<script>
// --- Layout and slot sizes for each orientation ---
const layoutSlotSizes = {
    portrait: {
        1:  [{w:2480, h:3508}],
        2:  [{w:2480, h:1754}, {w:2480, h:1754}],
        4:  Array(4).fill({w:1240, h:1754}),
        6:  Array(6).fill({w:1240, h:1169}),
        9:  Array(9).fill({w:826, h:1169})
    },
    landscape: {
        1:  [{w:3508, h:2480}],
        2:  [{w:1754, h:2480}, {w:1754, h:2480}],
        4:  Array(4).fill({w:1754, h:1240}),
        6:  Array(6).fill({w:1169, h:1240}),
        9:  Array(9).fill({w:1169, h:826})
    }
};
const a4Dims = {
    portrait: {w:2480, h:3508, canvasW:420, canvasH:600},
    landscape: {w:3508, h:2480, canvasW:600, canvasH:420}
};
let uploadedImages = [];
let currentLayout = 1;
let currentOrientation = 'portrait';
let selectedShop = '';
let availableShops = [];
const uploadBtn = document.getElementById('uploadBtn');
const fileInput = document.getElementById('fileInput');
const photosCount = document.getElementById('photosCount');
const thumbnailsGrid = document.getElementById('thumbnailsGrid');
const a4Canvas = document.getElementById('a4Canvas');
const layoutBtns = document.querySelectorAll('.layout-btn');
const printBtn = document.getElementById('printBtn');
const cancelBtn = document.getElementById('cancelBtn');
const calculateBtn = document.getElementById('calculateBtn');
const shopSelect = document.getElementById('shopSelect');
const photoDropdown = document.getElementById('photo-shop-dropdown');
const photoTrigger = document.getElementById('photo-shop-trigger');
const photoPanel = document.getElementById('photo-shop-panel');
const photoList = document.getElementById('photo-shop-list');
const pricingSummary = document.getElementById('pricingSummary');
const pricingDetails = document.getElementById('pricingDetails');
const orientationSelect = document.getElementById('orientation');
function loadShops() {
    fetch('/get-available-shops/', {headers: {'X-CSRFToken': getCookie('csrftoken')}})
        .then(r=>r.json())
        .then(data=>{
            if(data.success && data.shops.length>0){
                availableShops = data.shops;
            } else {
                availableShops = [];
            }
            renderPhotoShopDropdown();
        })
        .catch(()=>{ availableShops = []; renderPhotoShopDropdown(); });
}

function renderPhotoShopDropdown() {
    if (!photoList) return;
    if (!availableShops || availableShops.length === 0) {
        photoList.innerHTML = '<div style="padding:8px 10px; color:#6b7280;">No shops available</div>';
        selectedShop = '';
        shopSelect.value = '';
        return;
    }

    const listHtml = availableShops.map(s => {
        const distanceKm = (typeof s.distanceKm === 'number') ? s.distanceKm : null;
        const formattedDistance = distanceKm !== null ? (distanceKm < 1 ? `${Math.round(distanceKm * 1000)} m` : `${distanceKm.toFixed(1)} km`) : (s.formattedDistance || (s.distance_km ? `${Number(s.distance_km).toFixed(1)} km` : ''));
        const address = [s.address_line1, s.address_line2, s.city, s.state, s.postal_code].filter(Boolean).join(', ') || [s.area, s.city].filter(Boolean).join(', ');
        return `
          <div class="shop-card" data-shop="${s.shop_folder}" data-vendor_email="${s.vendor_email||''}" data-lat="${s.latitude||''}" data-lng="${s.longitude||''}">
            <div class="shop-card-left">
              <div class="shop-avatar"><i class="fas fa-store"></i></div>
            </div>
            <div class="shop-card-body">
              <div class="shop-name">${s.shop_name||'Print Shop'}</div>
              <div class="shop-address">${address}</div>
              <div class="shop-meta"><i class="fas fa-location-arrow"></i> ${formattedDistance}</div>
            </div>
          </div>`;
    }).join('');
    photoList.innerHTML = listHtml;

    // Default selection (match dashboard behavior)
    const first = availableShops[0];
    if (first) {
        selectedShop = first.shop_folder;
        shopSelect.value = selectedShop;
        const titleEl = photoTrigger.querySelector('.shop-title');
        const subEl = photoTrigger.querySelector('.shop-subtitle');
        if (titleEl) titleEl.textContent = first.shop_name || 'Selected Shop';
        const distanceKm = (typeof first.distanceKm === 'number') ? first.distanceKm : null;
        const distanceText = distanceKm !== null ? (distanceKm < 1 ? `${Math.round(distanceKm * 1000)} m` : `${distanceKm.toFixed(1)} km`) : (first.formattedDistance || (first.distance_km ? `${Number(first.distance_km).toFixed(1)} km` : ''));
        const addr = [first.address_line1, first.address_line2, first.city, first.state, first.postal_code].filter(Boolean).join(', ') || [first.area, first.city].filter(Boolean).join(', ');
        if (subEl) subEl.textContent = [addr, distanceText].filter(Boolean).join(' • ');
        const firstCard = photoList.querySelector('.shop-card');
        if (firstCard) firstCard.classList.add('selected');
    }

    photoList.addEventListener('click', (e) => {
        const trackBtn = e.target.closest('.shop-track-btn');
        const card = e.target.closest('.shop-card');
        if (!card) return;
        if (trackBtn) {
            const lat = card.getAttribute('data-lat');
            const lng = card.getAttribute('data-lng');
            if (!lat || !lng) { alert('Location not available for this shop.'); return; }
            const url = `https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent(lat)},${encodeURIComponent(lng)}&travelmode=driving`;
            window.open(url, '_blank');
            return;
        }
        // Toggle selected state like dashboard modal
        photoList.querySelectorAll('.shop-card').forEach(c => c.classList.remove('selected'));
        card.classList.add('selected');
        selectedShop = card.getAttribute('data-shop');
        shopSelect.value = selectedShop;
        const name = card.querySelector('.shop-name')?.textContent || 'Selected Shop';
        const address = card.querySelector('.shop-address')?.textContent || '';
        const meta = card.querySelector('.shop-meta')?.textContent || '';
        const titleEl = photoTrigger.querySelector('.shop-title');
        const subEl = photoTrigger.querySelector('.shop-subtitle');
        if (titleEl) titleEl.textContent = name;
        if (subEl) subEl.textContent = [address, meta].filter(Boolean).join(' • ');
        photoPanel.classList.remove('open');
    });
}

function positionPhotoPanel() {
    if (!photoTrigger || !photoPanel) return;
    const rect = photoTrigger.getBoundingClientRect();
    const viewportWidth = Math.max(document.documentElement.clientWidth || 0, window.innerWidth || 0);
    const panelWidth = Math.min(380, viewportWidth - 24);
    const centeredLeft = Math.round(rect.left + (rect.width / 2) - (panelWidth / 2));
    const clampedLeft = Math.max(12, Math.min(centeredLeft, viewportWidth - panelWidth - 12));
    photoPanel.style.width = panelWidth + 'px';
    photoPanel.style.left = clampedLeft + 'px';
    photoPanel.style.top = Math.round(rect.bottom + 8) + 'px';
}

if (photoTrigger && photoPanel) {
    photoTrigger.addEventListener('click', () => {
        if (!photoPanel.classList.contains('open')) positionPhotoPanel();
        photoPanel.classList.toggle('open');
    });
    document.addEventListener('click', (e) => { if (!photoDropdown.contains(e.target)) photoPanel.classList.remove('open'); });
    window.addEventListener('resize', () => { if (photoPanel.classList.contains('open')) positionPhotoPanel(); });
    window.addEventListener('scroll', () => { if (photoPanel.classList.contains('open')) positionPhotoPanel(); }, true);
}
function handleFileUpload(e) {
    const files = Array.from(e.target.files).filter(file => file.type.startsWith('image/'));
    if (files.length === 0) return;
    let loadedCount = 0;
    files.forEach((file, index) => {
        const reader = new FileReader();
        reader.onload = (event) => {
            uploadedImages.push({
                id: Date.now() + index,
                data: event.target.result,
                file: file,
                name: file.name
            });
            loadedCount++;
            if (loadedCount === files.length) {
                autoSelectLayout();
                updateUI();
            }
        };
        reader.readAsDataURL(file);
    });
}
function removePhoto(id) {
    uploadedImages = uploadedImages.filter(img => img.id !== id);
    autoSelectLayout();
    updateUI();
}
function autoSelectLayout() {
    const n = uploadedImages.length;
    const valid = [1,2,4,6,9];
    if(valid.includes(n)) {
        currentLayout = n;
        layoutBtns.forEach(b=>b.classList.remove('active'));
        const btn = Array.from(layoutBtns).find(b=>parseInt(b.dataset.layout)===n);
        if(btn) btn.classList.add('active');
    }
}

function updatePreview() {
    // Set canvas size for orientation
    const dims = a4Dims[currentOrientation];
    a4Canvas.width = dims.canvasW;
    a4Canvas.height = dims.canvasH;
    const ctx = a4Canvas.getContext('2d');
    ctx.clearRect(0,0,dims.canvasW,dims.canvasH);
    ctx.fillStyle = '#fff';
    ctx.fillRect(0,0,dims.canvasW,dims.canvasH);
    
    // Draw grid slots
    let cols, rows;
    switch(currentLayout) {
        case 1: cols=1; rows=1; break;
        case 2: cols=(currentOrientation==='portrait'?1:2); rows=(currentOrientation==='portrait'?2:1); break;
        case 4: cols=2; rows=2; break;
        case 6: cols=(currentOrientation==='portrait'?2:3); rows=(currentOrientation==='portrait'?3:2); break;
        case 9: cols=3; rows=3; break;
        default: cols=1; rows=1;
    }
    const slotW = dims.canvasW/cols;
    const slotH = dims.canvasH/rows;
    
    for(let i=0; i<currentLayout; i++){
        const x = (i%cols)*slotW;
        const y = Math.floor(i/cols)*slotH;
        
        ctx.save();
        
        if(i < uploadedImages.length && uploadedImages[i]){
            // Draw filled slot with actual image
            ctx.strokeStyle = '#2563eb';
            ctx.lineWidth = 1.2;
            ctx.strokeRect(x+2,y+2,slotW-4,slotH-4);
            
            const img = uploadedImages[i];
            const image = new window.Image();
            image.src = img.data;
            image.onload = function() {
                // Fit image in slot, keep aspect ratio
                const aspect = image.width/image.height;
                const slotAspect = slotW/slotH;
                let drawW, drawH, dx, dy;
                if(aspect>slotAspect){
                    drawW = slotW-8;
                    drawH = drawW/aspect;
                }else{
                    drawH = slotH-8;
                    drawW = drawH*aspect;
                }
                dx = x+((slotW-drawW)/2);
                dy = y+((slotH-drawH)/2);
                ctx.drawImage(image,dx,dy,drawW,drawH);
            }
        } else {
            // Draw empty slot with dashed border
            ctx.strokeStyle = '#d1d5db';
            ctx.lineWidth = 1;
            ctx.setLineDash([5, 5]);
            ctx.strokeRect(x+2,y+2,slotW-4,slotH-4);
            
            // Add "Empty" text
            ctx.fillStyle = '#9ca3af';
            ctx.font = '12px Arial';
            ctx.textAlign = 'center';
            ctx.fillText('Empty', x + slotW/2, y + slotH/2);
        }
        
        ctx.restore();
    }
}
async function createPDF() {
    const { jsPDF } = window.jspdf;
    const dims = a4Dims[currentOrientation];
    const pdf = new jsPDF(currentOrientation==='portrait'?'p':'l', 'pt', [dims.w, dims.h]);
    
    // Set white background
    pdf.setFillColor(255, 255, 255);
    pdf.rect(0, 0, dims.w, dims.h, 'F');
    
    let cols, rows;
    switch(currentLayout) {
        case 1: cols=1; rows=1; break;
        case 2: cols=(currentOrientation==='portrait'?1:2); rows=(currentOrientation==='portrait'?2:1); break;
        case 4: cols=2; rows=2; break;
        case 6: cols=(currentOrientation==='portrait'?2:3); rows=(currentOrientation==='portrait'?3:2); break;
        case 9: cols=3; rows=3; break;
        default: cols=1; rows=1;
    }
    
    const margin = 20;
    const spacing = 10;
    const totalWidth = dims.w - (2 * margin);
    const totalHeight = dims.h - (2 * margin);
    const slotW = (totalWidth - ((cols - 1) * spacing)) / cols;
    const slotH = (totalHeight - ((rows - 1) * spacing)) / rows;
    
    // Process only available uploaded images, don't replicate
    const availableImages = uploadedImages.length;
    
    for(let i = 0; i < currentLayout; i++){
        const col = i % cols;
        const row = Math.floor(i / cols);
        const x = margin + col * (slotW + spacing);
        const y = margin + row * (slotH + spacing);
        
        if(i < availableImages && uploadedImages[i]){
            // Add actual image to slot
            const img = uploadedImages[i];
            await new Promise(resolve => {
                const image = new Image();
                image.onload = function() {
                    try {
                        // Calculate dimensions to fit image in slot while maintaining aspect ratio
                        const imgAspect = image.width / image.height;
                        const slotAspect = slotW / slotH;
                        let drawW, drawH, dx, dy;
                        
                        if(imgAspect > slotAspect){
                            drawW = slotW - 8;
                            drawH = drawW / imgAspect;
                        } else {
                            drawH = slotH - 8;
                            drawW = drawH * imgAspect;
                        }
                        
                        dx = x + ((slotW - drawW) / 2);
                        dy = y + ((slotH - drawH) / 2);
                        
                        // Add image to PDF
                        pdf.addImage(image, 'JPEG', dx, dy, drawW, drawH);
                        
                        // Add border around image
                        pdf.setDrawColor(100, 100, 100);
                        pdf.setLineWidth(0.5);
                        pdf.rect(x, y, slotW, slotH);
                        
                        resolve();
                    } catch (error) {
                        console.error('Error adding image to PDF:', error);
                        resolve();
                    }
                };
                image.onerror = function() {
                    console.error('Error loading image for PDF');
                    resolve();
                };
                image.src = img.data;
            });
        } else {
            // Draw empty slot with dashed border
            pdf.setDrawColor(200, 200, 200);
            pdf.setLineWidth(1);
            pdf.setLineDashPattern([3, 3], 0);
            pdf.rect(x, y, slotW, slotH);
            pdf.setLineDashPattern([], 0); // Reset dash pattern
            
            // Add "Empty Slot" text in light gray
            pdf.setFontSize(10);
            pdf.setTextColor(180, 180, 180);
            pdf.text('Empty Slot', x + slotW/2, y + slotH/2, { align: 'center' });
        }
    }
    
    // Add title and info
    pdf.setFontSize(14);
    pdf.setTextColor(0, 0, 0);
    const title = `Photo Print Layout (${availableImages} photos in ${currentLayout} slots)`;
    pdf.text(title, dims.w/2, 30, { align: 'center' });
    
    pdf.setFontSize(10);
    pdf.setTextColor(100, 100, 100);
    const info = `A4 ${currentOrientation.charAt(0).toUpperCase() + currentOrientation.slice(1)} • ${cols}x${rows} Grid Layout • Print Ready`;
    pdf.text(info, dims.w/2, dims.h - 20, { align: 'center' });
    
    return pdf.output('blob');
}

function getCookie(name) {
    let cookieValue = null;
    if (document.cookie && document.cookie !== '') {
        const cookies = document.cookie.split(';');
        for (let cookie of cookies) {
            cookie = cookie.trim();
            if (cookie.substring(0, name.length + 1) === (name + '=')) {
                cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                break;
            }
        }
    }
    return cookieValue;
}

// Commission helper (same logic as dashboard)
function calculatePlatformCommission(serviceKey, vendorPrice) {
    // Default 20% for A4 color-like services
    const commissionRates = {
        a4_print_bw: 0.12,
        a4_print_color: 0.2,
        digital_print_a4: 0.15,
        digital_print_12x18: 0.18,
        gloss_paper_a4: 0.2
    };
    const rate = commissionRates[serviceKey] ?? 0.2;
    const amount = vendorPrice * rate;
    return { rate, amount, total: vendorPrice + amount };
}

async function calculatePhotoPrintPrice() {
    if (!selectedShop) {
        alert('Please select a shop first');
        return;
    }

    if (uploadedImages.length === 0) {
        alert('Please upload at least one photo first');
        return;
    }

    // Get selected vendor email
    const selectedVendor = availableShops.find(shop => shop.shop_folder === selectedShop);
    if (!selectedVendor || !selectedVendor.vendor_email) {
        alert('Unable to get vendor information');
        return;
    }

    // Collect form data for photo print
    const formData = {
        vendor_email: selectedVendor.vendor_email,
        photo_count: uploadedImages.length,
        layout_slots: currentLayout,
        orientation: currentOrientation,
        color: document.getElementById('color').value,
        copies: parseInt(document.getElementById('copies').value) || 1
    };

    console.log('Photo print form data being sent:', formData);

    // Show loading state
    const originalText = calculateBtn.innerHTML;
    calculateBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Calculating...';
    calculateBtn.disabled = true;

    try {
        const response = await fetch('/calculate-photo-print-pricing/', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'X-CSRFToken': getCookie('csrftoken')
            },
            body: JSON.stringify(formData)
        });

        const result = await response.json();

        if (result.success) {
            // Apply platform commission silently (same approach as dashboard)
            const breakdown = result.pricing_breakdown;
            const vendorPrice = Number(breakdown.total_price || 0);
            // Use A4 color pricing key for photo prints commission model
            const commission = calculatePlatformCommission('a4_print_color', vendorPrice);

            // Build display (do not show commission explicitly)
            let html = '';
            html += `
                <li class="pricing-item">
                    <span class="pricing-label">${breakdown.pricing_key_used.replace(/_/g, ' ').toUpperCase()}</span>
                    <span class="pricing-value">₹${Number(breakdown.base_price || 0)}</span>
                </li>
            `;
            html += `
                <li class="pricing-item">
                    <span class="pricing-label">Number of photos</span>
                    <span class="pricing-value">${breakdown.photo_count}</span>
                </li>
                <li class="pricing-item">
                    <span class="pricing-label">Layout slots</span>
                    <span class="pricing-value">${breakdown.layout_slots}</span>
                </li>
                <li class="pricing-item">
                    <span class="pricing-label">Number of copies</span>
                    <span class="pricing-value">${breakdown.copies}</span>
                </li>
            `;

            // Effective per-photo after adding commission
            const items = (Number(breakdown.photo_count || 1) * Number(breakdown.copies || 1)) || 1;
            const basePer = Number(breakdown.price_per_page || 0);
            const effectivePer = (basePer + (items ? (commission.amount / items) : 0)).toFixed(2);
            if (basePer) {
              html += `
                <li class="pricing-item">
                  <span class="pricing-label">Price per photo</span>
                  <span class="pricing-value">₹${effectivePer}</span>
                </li>
              `;
            }

            html += `
                <li class="pricing-item total">
                    <i class="fas fa-check-circle"></i>
                    <span class="pricing-label">Total Amount</span>
                    <span class="pricing-value">₹${Number(commission.total).toFixed(2)}</span>
                </li>
            `;

            pricingDetails.innerHTML = html;
            pricingSummary.style.display = 'block';

            // Store calculated price + breakdown in page dataset for submit
            const finalBreakdown = { ...breakdown };
            finalBreakdown.total_price = Number(commission.total).toFixed(2);
            document.body.dataset.calculatedPrice = finalBreakdown.total_price;
            document.body.dataset.pricingBreakdown = JSON.stringify(finalBreakdown);

        } else {
            alert('Error calculating price: ' + (result.error || 'Unknown error'));
        }
    } catch (error) {
        console.error('Error calculating photo print price:', error);
        alert('Error calculating price. Please try again.');
    } finally {
        // Restore button state
        calculateBtn.innerHTML = originalText;
        calculateBtn.disabled = false;
    }
}
async function handlePrint() {

        return;
    }

        return;
    }
    
    printBtn.disabled = true;

        const pdfBlob = await createPDF();

        const vendorId = selectedShopData ? selectedShopData.vendor_id : 'vendor1';

                };
                console.log('💰 Pricing details stored in job metadata for photo print:', pricingDetails);
            } catch (error) {
                console.error('Error parsing pricing breakdown:', error);
            }
        } else {
            console.log('⚠️ No pricing details available for photo print job');
        }
        
        // Create comprehensive metadata similar to other modals
        const metadata = {
            filename: pdfFileName,
            original_filename: firstImg ? firstImg.name : 'photo_layout.pdf',
            service_type: 'photo_print',
            service_name: 'Photo Print Service',
            job_id: jobId,
            token: token,
            layout: `${currentLayout}`,
            orientation: currentOrientation,
            photo_count: String(uploadedImages.length),

            empty_slots: String(Math.max(0, currentLayout - uploadedImages.length)),
            paper_size: currentOrientation === 'portrait' ? 'A4' : 'A4 Landscape',
            pageSize: currentOrientation === 'portrait' ? 'A4' : 'A4 Landscape',
            color: document.getElementById('color').value,
            copies: String(document.getElementById('copies').value),
            pageRange: 'all',
            specificPages: '',
            priority: 'Medium',
            quality: 'High',
            thickness: '120gsm',
            feedback: '',
            spiralBinding: 'No',
            lamination: 'No',
            timestamp: new Date().toISOString(),
            status: 'pending',
            job_completed: 'NO',
            trash: 'NO',
            is_manual_job: 'YES',
            vendor: vendorId,
            user: document.querySelector('meta[name="user-email"]')?.content || 'anonymous',
            pages: '1',
            layout_created: 'YES',
            image_mode: 'individual_placement',
            total_images: String(uploadedImages.length),
            grid_layout: getGridLayoutString(currentLayout, currentOrientation),
            layout_description: `${uploadedImages.length} images in ${currentLayout} slots (${Math.max(0, currentLayout - uploadedImages.length)} empty)`,
            // Add pricing details if available
            pricing_details: pricingDetails
        };
        
        const pdfFile = new File([pdfBlob], pdfFileName, { type: 'application/pdf' });
        formData.append('file_0', pdfFile);
        formData.append('file_count', '1');
        formData.append('settings_0', JSON.stringify(metadata));
        formData.append('selected_vendor', selectedShop);
        formData.append('vendor_id', vendorId);
        // Always use vendor_print_jobs for storage to match dashboard
        // formData.append('storage_folder', 'vendor_manual_print_jobs'); // Remove this line if present
        
        const response = await fetch('/upload/', {
            method: 'POST',
            body: formData,
            headers: { 'X-CSRFToken': getCookie('csrftoken') }
        });
        
        if (response.ok) {
            const result = await response.json();
            // Show success message with pricing details if available
            if (pricingDetails) {
                alert(`Photo print job submitted successfully!\n\nTotal Price: Rs${pricingDetails.total_price}\nVendor: ${selectedShopData?.shop_name || 'Unknown'}\nToken: ${token}`);
            } else {
                alert(`Photo print job submitted successfully! Token: ${token}`);
            }
            // window.location.href = '/userdashboard/'; // Remove redirect
            resetPhotoPrintModal();
        } else {
            const errorData = await response.json();
            throw new Error(errorData.error || 'Failed to submit print job');
        }
    } catch (error) {
        console.error('Error:', error);
        alert(`Error: ${error.message}`);
    } finally {
        printBtn.disabled = false;
        printBtn.textContent = 'Print';
    }
}

function getGridLayoutString(layout, orientation) {
    let cols, rows;
    switch(layout) {
        case 1: cols=1; rows=1; break;
        case 2: cols=(orientation==='portrait'?1:2); rows=(orientation==='portrait'?2:1); break;
        case 4: cols=2; rows=2; break;
        case 6: cols=(orientation==='portrait'?2:3); rows=(orientation==='portrait'?3:2); break;
        case 9: cols=3; rows=3; break;
        default: cols=1; rows=1;
    }
    return `${cols}x${rows}`;
}
