<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photo Print Service</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: #e8ecf5;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .modal-bg {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.35);
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .card-modal {
            background: #fff;
            border-radius: 16px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.18);
            max-width: 600px;
            min-width: 400px;
            width: 100%;
            max-height: 98vh;
            min-height: 700px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .modal-header {
            background: #2563eb;
            color: #fff;
            padding: 22px 32px 12px 32px;
            border-radius: 16px 16px 0 0;
            text-align: center;
        }
        .modal-header h1 {
            font-size: 1.4rem;
            margin-bottom: 4px;
        }
        .modal-header p {
            font-size: 1rem;
            color: #dbeafe;
        }
        .modal-content {
            flex: 1;
            overflow-y: auto;
            padding: 24px 32px 0 32px;
            background: #f8fafc;
            min-height: 400px;
            display: flex;
            flex-direction: row;
            gap: 24px;
        }
        .left-panel {
            flex: 1.2;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding-right: 10px;
        }
        .right-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 20px;
            justify-content: flex-start;
            padding-left: 10px;
        }
        .right-panel .form-group {
            margin-bottom: 16px;
        }
        .right-panel label {
            font-size: 1rem;
            color: #222;
            margin-bottom: 4px;
            display: block;
        }
        .right-panel select, .right-panel input[type=number] {
            width: 100%;
            padding: 10px 10px;
            border-radius: 5px;
            border: 1px solid #d1d5db;
            font-size: 1rem;
            background: #fff;
            margin-top: 2px;
        }
        .upload-btn {
            background: #2563eb;
            color: #fff;
            border: none;
            padding: 12px 0;
            border-radius: 6px;
            cursor: pointer;
            font-size: 1rem;
            width: 100%;
            margin-bottom: 12px;
            transition: background 0.2s;
        }
        .upload-btn:hover {
            background: #1d4ed8;
        }
        .photos-count {
            font-size: 1rem;
            color: #222;
            text-align: right;
            margin-bottom: 8px;
        }
        .thumbnails-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            margin-bottom: 18px;
        }
        .thumb {
            position: relative;
            width: 60px;
            height: 60px;
            border-radius: 6px;
            overflow: hidden;
            background: #f1f5f9;
            box-shadow: 0 1px 4px rgba(0,0,0,0.04);
        }
        .thumb img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .remove-thumb {
            position: absolute;
            top: 2px;
            right: 2px;
            background: #ef4444;
            color: #fff;
            border: none;
            border-radius: 50%;
            width: 18px;
            height: 18px;
            font-size: 13px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2;
        }
        .layout-row {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin: 10px 0 18px 0;
        }
        .layout-btn {
            background: #f1f5f9;
            border: 1.5px solid #d1d5db;
            color: #2563eb;
            border-radius: 5px;
            padding: 7px 13px;
            font-size: 1rem;
            cursor: pointer;
            transition: background 0.2s, border 0.2s;
        }
        .layout-btn.active, .layout-btn:focus {
            background: #2563eb;
            color: #fff;
            border-color: #2563eb;
        }
        .shop-row, .orientation-row {
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 0 0 10px 0;
        }
        .shop-row label, .orientation-row label {
            font-size: 1rem;
            color: #222;
            min-width: 70px;
        }
        .shop-row select, .orientation-row select {
            flex: 1;
            padding: 7px 8px;
            border-radius: 5px;
            border: 1px solid #d1d5db;
            font-size: 1rem;
        }
        .preview-section {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 340px;
            margin: 0 0 18px 0;
        }
        .a4-canvas {
            background: #fff;
            border: 1.5px solid #e5e7eb;
            border-radius: 6px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
            width: 420px;
            height: 600px;
            max-width: 100%;
            max-height: 100%;
            display: block;
            margin-top: 8px;
        }
        .footer-controls {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 24px;
            padding: 20px 32px 20px 32px;
            background: #f1f5f9;
            border-top: 1px solid #e5e7eb;
            position: sticky;
            bottom: 0;
            z-index: 2;
        }
        .footer-controls select, .footer-controls input[type=number] {
            padding: 6px 8px;
            border-radius: 5px;
            border: 1px solid #d1d5db;
            font-size: 1rem;
        }
        .footer-controls label {
            font-size: 1rem;
            color: #222;
            margin-right: 4px;
        }
        .print-btn {
            background: #2563eb;
            color: #fff;
            border: none;
            border-radius: 6px;
            padding: 10px 28px;
            font-size: 1.1rem;
            cursor: pointer;
            margin-left: auto;
            transition: background 0.2s;
            box-shadow: 0 2px 8px rgba(37,99,235,0.08);
            font-weight: 600;
            min-width: 110px;
        }
        .print-btn:disabled {
            background: #bcd0fa;
            color: #fff;
            cursor: not-allowed;
        }
        .print-btn:hover:not(:disabled) {
            background: #1746a2;
        }
        .cancel-btn {
            background: #222;
            color: #fff;
            border: none;
            border-radius: 6px;
            padding: 10px 18px;
            font-size: 1.1rem;
            cursor: pointer;
            margin-right: 8px;
            transition: background 0.2s;
            min-width: 110px;
        }
        .cancel-btn:hover {
            background: #111;
        }
        @media (max-width: 800px) {
            .card-modal {
                max-width: 99vw;
                min-width: unset;
                padding: 0 0 10px 0;
            }
            .modal-content {
                flex-direction: column;
                gap: 0;
                padding: 18px 8px 0 8px;
            }
            .left-panel, .right-panel {
                width: 100%;
                min-width: 0;
                flex: unset;
                padding: 0;
            }
            .right-panel {
                margin-top: 18px;
            }
            .footer-controls {
                padding: 16px 8px 16px 8px;
            }
        }
    </style>
</head>
<body>
<div class="modal-bg">
    <div class="card-modal">
        <div class="modal-header">
            <h1>Photo Print Service</h1>
            <p>Upload your photos, select layout, and print instantly!</p>
        </div>
        <div class="modal-content">
            <div class="left-panel">
                <button class="upload-btn" id="uploadBtn">Upload Photos</button>
                <input type="file" id="fileInput" accept="image/*" multiple style="display:none;">
                <div class="photos-count" id="photosCount">0 photos uploaded</div>
                <div class="thumbnails-grid" id="thumbnailsGrid"></div>
                <div class="layout-row">
                    <button class="layout-btn active" data-layout="1">1</button>
                    <button class="layout-btn" data-layout="2">2</button>
                    <button class="layout-btn" data-layout="4">4</button>
                    <button class="layout-btn" data-layout="6">6</button>
                    <button class="layout-btn" data-layout="9">9</button>
                </div>
                <div class="preview-section">
                    <canvas id="a4Canvas" class="a4-canvas" width="420" height="600"></canvas>
                </div>
            </div>
            <div class="right-panel">
                <div class="form-group">
                    <label for="orientation">Orientation:</label>
                    <select id="orientation">
                        <option value="portrait">Portrait</option>
                        <option value="landscape">Landscape</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="shopSelect">Shop:</label>
                    <select id="shopSelect">
                        <option value="">Loading shops...</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="color">Color:</label>
                    <select id="color">
                        <option value="Color">Color</option>
                        <option value="Black & White">Black & White</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="copies">Copies:</label>
                    <input type="number" id="copies" value="1" min="1" max="50" style="width:100%;">
                </div>
            </div>
        </div>
        <div class="footer-controls">
            <button class="cancel-btn" id="cancelBtn">Cancel</button>
            <button class="print-btn" id="printBtn" disabled>Print</button>
        </div>
    </div>
</div>
<script>
// --- Layout and slot sizes for each orientation ---
const layoutSlotSizes = {
    portrait: {
        1:  [{w:2480, h:3508}],
        2:  [{w:2480, h:1754}, {w:2480, h:1754}],
        4:  Array(4).fill({w:1240, h:1754}),
        6:  Array(6).fill({w:1240, h:1169}),
        9:  Array(9).fill({w:826, h:1169})
    },
    landscape: {
        1:  [{w:3508, h:2480}],
        2:  [{w:1754, h:2480}, {w:1754, h:2480}],
        4:  Array(4).fill({w:1754, h:1240}),
        6:  Array(6).fill({w:1169, h:1240}),
        9:  Array(9).fill({w:1169, h:826})
    }
};
const a4Dims = {
    portrait: {w:2480, h:3508, canvasW:420, canvasH:600},
    landscape: {w:3508, h:2480, canvasW:600, canvasH:420}
};
let uploadedImages = [];
let currentLayout = 1;
let currentOrientation = 'portrait';
let selectedShop = '';
let availableShops = [];
const uploadBtn = document.getElementById('uploadBtn');
const fileInput = document.getElementById('fileInput');
const photosCount = document.getElementById('photosCount');
const thumbnailsGrid = document.getElementById('thumbnailsGrid');
const a4Canvas = document.getElementById('a4Canvas');
const layoutBtns = document.querySelectorAll('.layout-btn');
const printBtn = document.getElementById('printBtn');
const cancelBtn = document.getElementById('cancelBtn');
const shopSelect = document.getElementById('shopSelect');
const orientationSelect = document.getElementById('orientation');
function loadShops() {
    fetch('/get-available-shops/', {headers: {'X-CSRFToken': getCookie('csrftoken')}})
        .then(r=>r.json())
        .then(data=>{
            if(data.success && data.shops.length>0){
                availableShops = data.shops;
                selectedShop = data.shops[0].shop_folder;
                shopSelect.innerHTML = data.shops.map(shop=>`<option value="${shop.shop_folder}">${shop.shop_name} - ${shop.city}</option>`).join('');
            }else{
                availableShops = [];
                selectedShop = 'firozshop';
                shopSelect.innerHTML = '<option value="firozshop">Default Shop</option>';
            }
        });
    shopSelect.addEventListener('change', ()=>{selectedShop = shopSelect.value;});
}
function handleFileUpload(e) {
    const files = Array.from(e.target.files).filter(file => file.type.startsWith('image/'));
    if (files.length === 0) return;
    let loadedCount = 0;
    files.forEach((file, index) => {
        const reader = new FileReader();
        reader.onload = (event) => {
            uploadedImages.push({
                id: Date.now() + index,
                data: event.target.result,
                file: file,
                name: file.name
            });
            loadedCount++;
            if (loadedCount === files.length) {
                autoSelectLayout();
                updateUI();
            }
        };
        reader.readAsDataURL(file);
    });
}
function removePhoto(id) {
    uploadedImages = uploadedImages.filter(img => img.id !== id);
    autoSelectLayout();
    updateUI();
}
function autoSelectLayout() {
    const n = uploadedImages.length;
    const valid = [1,2,4,6,9];
    if(valid.includes(n)) {
        currentLayout = n;
        layoutBtns.forEach(b=>b.classList.remove('active'));
        const btn = Array.from(layoutBtns).find(b=>parseInt(b.dataset.layout)===n);
        if(btn) btn.classList.add('active');
    }
}
function updateUI() {
    photosCount.textContent = `${uploadedImages.length} photos uploaded`;
    updateThumbnails();
    updatePreview();
    printBtn.disabled = uploadedImages.length === 0;
}
function updateThumbnails() {
    if (uploadedImages.length === 0) {
        thumbnailsGrid.innerHTML = '';
        return;
    }
    thumbnailsGrid.innerHTML = uploadedImages.map(img => `
        <div class="thumb">
            <img src="${img.data}" alt="thumb">
            <button class="remove-thumb" onclick="removePhoto(${img.id})">&times;</button>
        </div>
    `).join('');
}
function updatePreview() {
    // Set canvas size for orientation
    const dims = a4Dims[currentOrientation];
    a4Canvas.width = dims.canvasW;
    a4Canvas.height = dims.canvasH;
    const ctx = a4Canvas.getContext('2d');
    ctx.clearRect(0,0,dims.canvasW,dims.canvasH);
    ctx.fillStyle = '#fff';
    ctx.fillRect(0,0,dims.canvasW,dims.canvasH);
    // Draw grid slots
    const slots = layoutSlotSizes[currentOrientation][currentLayout];
    let cols, rows;
    switch(currentLayout) {
        case 1: cols=1; rows=1; break;
        case 2: cols=(currentOrientation==='portrait'?1:2); rows=(currentOrientation==='portrait'?2:1); break;
        case 4: cols=2; rows=2; break;
        case 6: cols=(currentOrientation==='portrait'?2:3); rows=(currentOrientation==='portrait'?3:2); break;
        case 9: cols=3; rows=3; break;
        default: cols=1; rows=1;
    }
    const slotW = dims.canvasW/cols;
    const slotH = dims.canvasH/rows;
    for(let i=0;i<currentLayout;i++){
        if(uploadedImages.length === 0) break;
        const img = uploadedImages[i % uploadedImages.length];
        const x = (i%cols)*slotW;
        const y = Math.floor(i/cols)*slotH;
        ctx.save();
        ctx.strokeStyle = '#2563eb';
        ctx.lineWidth = 1.2;
        ctx.strokeRect(x+2,y+2,slotW-4,slotH-4);
        if(img){
            const image = new window.Image();
            image.src = img.data;
            image.onload = function() {
                // Fit image in slot, keep aspect ratio
                const aspect = image.width/image.height;
                const slotAspect = slotW/slotH;
                let drawW, drawH, dx, dy;
                if(aspect>slotAspect){
                    drawW = slotW-8;
                    drawH = drawW/aspect;
                }else{
                    drawH = slotH-8;
                    drawW = drawH*aspect;
                }
                dx = x+((slotW-drawW)/2);
                dy = y+((slotH-drawH)/2);
                ctx.drawImage(image,dx,dy,drawW,drawH);
            }
        }
        ctx.restore();
    }
}
async function createPDF() {
    const { jsPDF } = window.jspdf;
    const dims = a4Dims[currentOrientation];
    const pdf = new jsPDF(currentOrientation==='portrait'?'p':'l', 'pt', [dims.w, dims.h]);
    const slots = layoutSlotSizes[currentOrientation][currentLayout];
    let cols, rows;
    switch(currentLayout) {
        case 1: cols=1; rows=1; break;
        case 2: cols=(currentOrientation==='portrait'?1:2); rows=(currentOrientation==='portrait'?2:1); break;
        case 4: cols=2; rows=2; break;
        case 6: cols=(currentOrientation==='portrait'?2:3); rows=(currentOrientation==='portrait'?3:2); break;
        case 9: cols=3; rows=3; break;
        default: cols=1; rows=1;
    }
    const slotW = dims.w/cols;
    const slotH = dims.h/rows;
    for(let i=0;i<currentLayout;i++){
        if(uploadedImages.length === 0) break;
        const img = uploadedImages[i % uploadedImages.length];
        const x = (i%cols)*slotW;
        const y = Math.floor(i/cols)*slotH;
        if(img){
            await new Promise(resolve=>{
                const image = new window.Image();
                image.src = img.data;
                image.onload = function() {
                    // Fit image in slot, keep aspect ratio
                    const aspect = image.width/image.height;
                    const slotAspect = slotW/slotH;
                    let drawW, drawH, dx, dy;
                    if(aspect>slotAspect){
                        drawW = slotW-8;
                        drawH = drawW/aspect;
                    }else{
                        drawH = slotH-8;
                        drawW = drawH*aspect;
                    }
                    dx = x+((slotW-drawW)/2);
                    dy = y+((slotH-drawH)/2);
                    pdf.addImage(image, 'JPEG', dx, dy, drawW, drawH);
                    resolve();
                }
            });
        }
    }
    return pdf.output('blob');
}
printBtn.addEventListener('click', handlePrint);
cancelBtn.addEventListener('click', () => window.location.href = '/userdashboard/');
layoutBtns.forEach(btn => {
    btn.addEventListener('click', () => {
        layoutBtns.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentLayout = parseInt(btn.dataset.layout);
        updatePreview();
    });
});
orientationSelect.addEventListener('change', ()=>{
    currentOrientation = orientationSelect.value;
    updatePreview();
});
function getCookie(name) {
    let cookieValue = null;
    if (document.cookie && document.cookie !== '') {
        const cookies = document.cookie.split(';');
        for (let cookie of cookies) {
            cookie = cookie.trim();
            if (cookie.substring(0, name.length + 1) === (name + '=')) {
                cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                break;
            }
        }
    }
    return cookieValue;
}
async function handlePrint() {
    if (uploadedImages.length === 0) {
        alert('Please upload at least one photo');
        return;
    }
    if (!selectedShop) {
        alert('Please select a shop');
        return;
    }
    printBtn.disabled = true;
    printBtn.textContent = 'Creating PDF...';
    try {
        const pdfBlob = await createPDF();
        const formData = new FormData();
        const jobId = 'photo_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9);
        const selectedShopData = availableShops.find(shop => shop.shop_folder === selectedShop);
        const vendorId = selectedShopData ? selectedShopData.vendor_id : 'vendor1';
        // Use the first image's name for filename fields
        const firstImg = uploadedImages[0];
        const metadata = {
            filename: `photo_layout_${jobId}.pdf`,
            original_filename: firstImg ? firstImg.name : '',
            service_type: 'photo_print',
            service_name: 'Photo Print Service',
            job_id: jobId,
            layout: `${currentLayout}`,
            orientation: currentOrientation,
            photo_count: currentLayout,
            paper_size: currentOrientation==='portrait'?'A4 Portrait':'A4 Landscape',
            color: document.getElementById('color').value,
            copies: parseInt(document.getElementById('copies').value),
            pageRange: 'all',
            specificPages: '',
            pageSize: currentOrientation==='portrait'?'A4 Portrait':'A4 Landscape',
            quality: 'standard',
            thickness: '120gsm',
            feedback: '',
            spiralBinding: 'No',
            lamination: 'No',
            timestamp: new Date().toISOString(),
            status: "pending",
            job_completed: "NO",
            trash: "NO",
            is_manual_job: "YES"
        };
        const pdfFile = new File([pdfBlob], `photo_layout_${jobId}.pdf`, { type: 'application/pdf' });
        formData.append('file_0', pdfFile);
        formData.append('file_count', '1');
        formData.append('settings_0', JSON.stringify(metadata));
        formData.append('selected_vendor', selectedShop);
        formData.append('vendor_id', vendorId);
        formData.append('storage_folder', 'vendor_manual_print_jobs');
        const response = await fetch('/upload/', {
            method: 'POST',
            body: formData,
            headers: { 'X-CSRFToken': getCookie('csrftoken') }
        });
        if (response.ok) {
            alert('Photo print job submitted successfully!');
            window.location.href = '/userdashboard/';
        } else {
            const errorData = await response.json();
            throw new Error(errorData.error || 'Failed to submit print job');
        }
    } catch (error) {
        console.error('Error:', error);
        alert(`Error: ${error.message}`);
    } finally {
        printBtn.disabled = false;
        printBtn.textContent = 'Print';
    }
}
loadShops();
updatePreview();
updateThumbnails();
window.removePhoto = removePhoto;
uploadBtn.addEventListener('click', () => fileInput.click());
fileInput.addEventListener('change', handleFileUpload);
</script>
</body>
</html>
