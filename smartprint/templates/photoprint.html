<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="user-email" content="{{ user.email|default:'anonymous' }}">
    <title>Photo Print Service</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: #e8ecf5;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .modal-bg {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.35);
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .card-modal {
            background: #fff;
            border-radius: 16px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.18);
            max-width: 600px;
            min-width: 400px;
            width: 100%;
            max-height: 98vh;
            min-height: 700px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .modal-header {
            background: #2563eb;
            color: #fff;
            padding: 22px 32px 12px 32px;
            border-radius: 16px 16px 0 0;
            text-align: center;
        }
        .modal-header h1 {
            font-size: 1.4rem;
            margin-bottom: 4px;
        }
        .modal-header p {
            font-size: 1rem;
            color: #dbeafe;
        }
        .modal-content {
            flex: 1;
            overflow-y: auto;
            padding: 24px 32px 0 32px;
            background: #f8fafc;
            min-height: 400px;
            display: flex;
            flex-direction: row;
            gap: 24px;
        }
        .left-panel {
            flex: 1.2;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding-right: 10px;
        }
        .right-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 20px;
            justify-content: flex-start;
            padding-left: 10px;
        }
        .right-panel .form-group {
            margin-bottom: 16px;
        }
        .right-panel label {
            font-size: 1rem;
            color: #222;
            margin-bottom: 4px;
            display: block;
        }
        .right-panel select, .right-panel input[type=number] {
            width: 100%;
            padding: 10px 10px;
            border-radius: 5px;
            border: 1px solid #d1d5db;
            font-size: 1rem;
            background: #fff;
            margin-top: 2px;
        }
        .upload-btn {
            background: #2563eb;
            color: #fff;
            border: none;
            padding: 12px 0;
            border-radius: 6px;
            cursor: pointer;
            font-size: 1rem;
            width: 100%;
            margin-bottom: 12px;
            transition: background 0.2s;
        }
        .upload-btn:hover {
            background: #1d4ed8;
        }
        .photos-count {
            font-size: 1rem;
            color: #222;
            text-align: right;
            margin-bottom: 8px;
        }
        .thumbnails-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            margin-bottom: 18px;
        }
        .thumb {
            position: relative;
            width: 60px;
            height: 60px;
            border-radius: 6px;
            overflow: hidden;
            background: #f1f5f9;
            box-shadow: 0 1px 4px rgba(0,0,0,0.04);
        }
        .thumb img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .remove-thumb {
            position: absolute;
            top: 2px;
            right: 2px;
            background: #ef4444;
            color: #fff;
            border: none;
            border-radius: 50%;
            width: 18px;
            height: 18px;
            font-size: 13px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2;
        }
        .layout-row {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin: 10px 0 18px 0;
        }
        .layout-btn {
            background: #f1f5f9;
            border: 1.5px solid #d1d5db;
            color: #2563eb;
            border-radius: 5px;
            padding: 7px 13px;
            font-size: 1rem;
            cursor: pointer;
            transition: background 0.2s, border 0.2s;
        }
        .layout-btn.active, .layout-btn:focus {
            background: #2563eb;
            color: #fff;
            border-color: #2563eb;
        }
        .shop-row, .orientation-row {
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 0 0 10px 0;
        }
        .shop-row label, .orientation-row label {
            font-size: 1rem;
            color: #222;
            min-width: 70px;
        }
        .shop-row select, .orientation-row select {
            flex: 1;
            padding: 7px 8px;
            border-radius: 5px;
            border: 1px solid #d1d5db;
            font-size: 1rem;
        }
        .preview-section {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 280px;
            margin: 0 0 18px 0;
        }
        .a4-canvas {
            background: #fff;
            border: 2px solid #000;
            border-radius: 6px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
            width: 300px;
            height: 400px;
            max-width: 100%;
            max-height: 100%;
            display: block;
            margin-top: 8px;
        }
        .footer-controls {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 24px;
            padding: 20px 32px 20px 32px;
            background: #f1f5f9;
            border-top: 1px solid #e5e7eb;
            position: sticky;
            bottom: 0;
            z-index: 2;
        }
        .footer-controls select, .footer-controls input[type=number] {
            padding: 6px 8px;
            border-radius: 5px;
            border: 1px solid #d1d5db;
            font-size: 1rem;
        }
        .footer-controls label {
            font-size: 1rem;
            color: #222;
            margin-right: 4px;
        }
        .print-btn {
            background: #2563eb;
            color: #fff;
            border: none;
            border-radius: 6px;
            padding: 10px 28px;
            font-size: 1.1rem;
            cursor: pointer;
            margin-left: auto;
            transition: background 0.2s;
            box-shadow: 0 2px 8px rgba(37,99,235,0.08);
            font-weight: 600;
            min-width: 110px;
        }
        .print-btn:disabled {
            background: #bcd0fa;
            color: #fff;
            cursor: not-allowed;
        }
        .print-btn:hover:not(:disabled) {
            background: #1746a2;
        }
        .cancel-btn {
            background: #222;
            color: #fff;
            border: none;
            border-radius: 6px;
            padding: 10px 18px;
            font-size: 1.1rem;
            cursor: pointer;
            margin-right: 8px;
            transition: background 0.2s;
            min-width: 110px;
        }
        .cancel-btn:hover {
            background: #111;
        }
        .calculate-btn {
            background: #059669;
            color: #fff;
            border: none;
            border-radius: 6px;
            padding: 10px 18px;
            font-size: 1.1rem;
            cursor: pointer;
            margin-right: 8px;
            transition: background 0.2s;
            min-width: 110px;
        }
        .calculate-btn:hover {
            background: #047857;
        }
        .calculate-btn:disabled {
            background: #9ca3af;
            cursor: not-allowed;
        }
        .pricing-summary {
            background: linear-gradient(135deg, #f0f4f8 0%, #e0e7ef 100%);
            border-radius: 14px;
            box-shadow: 0 2px 12px rgba(80, 120, 200, 0.08);
            padding: 24px 28px 18px 28px;
            margin-top: 18px;
            max-width: 420px;
            margin-left: auto;
            margin-right: auto;
            border: 1px solid #e2e8f0;
            transition: box-shadow 0.2s;
        }
        .pricing-summary h3 {
            margin: 0 0 18px 0;
            color: #2563eb;
            font-size: 1.25rem;
            font-weight: 600;
            letter-spacing: 0.01em;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .pricing-summary h3 i {
            color: #059669;
            font-size: 1.2em;
        }
        .pricing-breakdown-list {
            margin: 0;
            padding: 0;
            list-style: none;
        }
        .pricing-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid #e5e7eb;
            font-size: 1.05rem;
        }
        .pricing-item:last-child {
            border-bottom: none;
        }
        .pricing-label {
            color: #475569;
            font-weight: 500;
        }
        .pricing-value {
            color: #1e293b;
            font-weight: 600;
        }
        .pricing-item.total {
            font-size: 1.18rem;
            color: #059669;
            font-weight: 700;
            background: #e0f7ef;
            border-radius: 6px;
            margin-top: 10px;
            padding: 14px 0;
            border-bottom: none;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .pricing-item.total .fa-check-circle {
            color: #059669;
            font-size: 1.2em;
        }

        .points-section {
            background: linear-gradient(135deg, #f8fafc, #e2e8f0);
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            padding: 1rem;
            margin-top: 1rem;
            transition: all 0.3s ease;
        }

        .points-header {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            margin-bottom: 0.75rem;
        }

        .points-icon {
            width: 24px;
            height: 24px;
            background: linear-gradient(135deg, #f59e0b, #d97706);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 12px;
        }

        .points-title {
            font-weight: 600;
            color: #1e293b;
            font-size: 0.95rem;
        }

        .points-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 1rem;
        }

        .points-info {
            display: flex;
            flex-direction: column;
            gap: 0.25rem;
            flex: 1;
        }

        .points-available, .points-balance {
            font-size: 0.85rem;
            color: #64748b;
        }

        .points-available span, .points-balance span {
            font-weight: 600;
            color: #1e293b;
        }

        .points-actions {
            display: flex;
            gap: 0.5rem;
        }

        .btn-apply-points, .btn-remove-points {
            padding: 0.5rem 1rem;
            border-radius: 6px;
            font-size: 0.85rem;
            font-weight: 600;
            border: none;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .btn-apply-points {
            background: linear-gradient(135deg, #f59e0b, #d97706);
            color: white;
        }

        .btn-apply-points:hover {
            background: linear-gradient(135deg, #d97706, #b45309);
            transform: translateY(-1px);
            box-shadow: 0 4px 8px rgba(245, 158, 11, 0.3);
        }

        .btn-remove-points {
            background: #ef4444;
            color: white;
        }

        .btn-remove-points:hover {
            background: #dc2626;
            transform: translateY(-1px);
            box-shadow: 0 4px 8px rgba(239, 68, 68, 0.3);
        }

        .points-applied {
            background: linear-gradient(135deg, #10b981, #059669);
            border-color: #059669;
        }

        .points-applied .points-icon {
            background: linear-gradient(135deg, #10b981, #059669);
        }
        /* Shop dropdown (beautiful design from print modal) */
        .shop-dropdown2 { position: relative; width: 100%; }
        .shop-trigger { display:flex; align-items:center; justify-content:space-between; width:100%; background:#fff; border:1px solid #e5e7eb; padding:12px; border-radius:10px; box-shadow: 0 1px 2px rgba(0,0,0,.04); cursor:pointer; }
        .shop-trigger-label { display:flex; align-items:center; gap:10px; min-width:0; }
        .shop-trigger .shop-avatar { width:28px; height:28px; border-radius:50%; display:flex; align-items:center; justify-content:center; background:#eef2ff; color:#4f46e5; }
        .shop-trigger .shop-title { font-weight:600; color:#111827; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
        .shop-trigger .shop-subtitle { font-size:12px; color:#6b7280; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
        .shop-caret { color:#6b7280; }
        .shop-panel { position:fixed; background:#fff; border:1px solid #e5e7eb; border-radius:12px; box-shadow:0 12px 24px rgba(0,0,0,.18); padding:6px 6px; z-index:99999; display:none; max-height:45vh; overflow:auto; max-width:420px; width:auto; overscroll-behavior:contain; }
        .shop-panel.open { display:block; }
        .shop-list { display:block; }
        .shop-row { display:flex; align-items:center; gap:12px; padding:10px 12px; border-bottom:1px solid #eef2f7; background:#fff; cursor:pointer; }
        .shop-row:hover { background:#f8fafc; }
        .shop-row.selected { background:#f0f7ff; outline:2px solid #2563eb; }
        .row-left { display:flex; align-items:center; }
        .avatar { width:32px; height:32px; border-radius:50%; object-fit:cover; box-shadow:0 1px 2px rgba(0,0,0,.06); }
        .row-body { flex:1; min-width:0; display:flex; flex-direction:column; padding-right: 96px; }
        .row-title { font-weight:600; color:#111827; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
        .row-sub { font-size:12px; color:#6b7280; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
        .row-meta { display:flex; align-items:center; gap:8px; color:#2563eb; margin-left:auto; white-space:nowrap; flex-shrink:0; }
        .track-btn { background:#10b981; color:#fff; border:none; border-radius:8px; padding:6px 8px; display:flex; align-items:center; justify-content:center; cursor:pointer; }
        .shop-trigger, .shop-panel, .shop-dropdown2 { max-width: 360px; margin-left:auto; margin-right:auto; }
        .shop-dropdown2 { padding-left: 12px; padding-right: 12px; box-sizing: border-box; }
        @media (max-width: 768px) { .row-title { font-size:14px; } .row-sub { font-size:12px; } }
        @media (max-width: 800px) {
            .card-modal {
                max-width: 99vw;
                min-width: unset;
                padding: 0 0 10px 0;
            }
            .modal-content {
                flex-direction: column;
                gap: 0;
                padding: 18px 8px 0 8px;
            }
            .left-panel, .right-panel {
                width: 100%;
                min-width: 0;
                flex: unset;
                padding: 0;
            }
            .right-panel {
                margin-top: 18px;
            }
            .footer-controls {
                padding: 16px 8px 16px 8px;
            }
        }
    </style>
</head>
<body>
<div class="modal-bg">
    <div class="card-modal">
        <div class="modal-header">
            <h1>Photo Print Service</h1>
            <p>Upload your photos, select layout, and print instantly!</p>
        </div>
        <div class="modal-content">
            <div class="left-panel">
                <button class="upload-btn" id="uploadBtn">Upload Photos</button>
                <input type="file" id="fileInput" accept="image/*" multiple style="display:none;">
                <div class="photos-count" id="photosCount">0 photos uploaded</div>
                <div class="thumbnails-grid" id="thumbnailsGrid"></div>
                <div class="layout-row">
                    <button class="layout-btn active" data-layout="1">1</button>
                    <button class="layout-btn" data-layout="2">2</button>
                    <button class="layout-btn" data-layout="4">4</button>
                    <button class="layout-btn" data-layout="6">6</button>
                    <button class="layout-btn" data-layout="9">9</button>
                </div>
                <div class="preview-section">
                    <canvas id="a4Canvas" class="a4-canvas" width="300" height="400"></canvas>
                </div>
            </div>
            <div class="right-panel">
                <div class="form-group">
                    <label for="orientation">Orientation:</label>
                    <select id="orientation">
                        <option value="portrait">Portrait</option>
                        <option value="landscape">Landscape</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="shopSelect">Shop:</label>
                    <input type="hidden" id="shopSelect" value="" />
                    <div class="shop-dropdown2" id="photo-shop-dropdown">
                        <button type="button" class="shop-trigger" id="photo-shop-trigger">
                            <div class="shop-trigger-label">
                                <div class="shop-avatar"><i class="fas fa-store"></i></div>
                                <div style="display:flex; flex-direction:column; min-width:0;">
                                    <div class="shop-title">Select Shop</div>
                                    <div class="shop-subtitle">Choose a nearby print shop</div>
                                </div>
                            </div>
                            <i class="fas fa-chevron-down shop-caret"></i>
                        </button>
                        <div class="shop-panel" id="photo-shop-panel">
                            <div class="shop-list" id="photo-shop-list"></div>
                        </div>
                    </div>
                </div>
                <div class="form-group">
                    <label for="color">Color:</label>
                    <select id="color">
                                        <option value="Color">Color</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="copies">Copies:</label>
                    <input type="number" id="copies" value="1" min="1" max="50" style="width:100%;">
                </div>
                <div class="pricing-summary" id="pricingSummary" style="display: none;">
                    <h3><i class="fas fa-receipt"></i> Pricing Summary</h3>
                    <ul class="pricing-breakdown-list" id="pricingDetails"></ul>
                </div>
                
                <!-- Points Application Section -->
                <div class="points-section" id="photoprint-points-section" style="display: none;">
                    <div class="points-header">
                        <div class="points-icon">
                            <i class="fas fa-star"></i>
                        </div>
                        <div class="points-title">Apply Points</div>
                    </div>
                    <div class="points-content">
                        <div class="points-info">
                            <span class="points-available">Available Points: <span id="photoprint-available-points">0</span></span>
                            <span class="points-balance">Balance after payment: <span id="photoprint-points-balance">0</span></span>
                        </div>
                        <div class="points-actions">
                            <button type="button" class="btn-apply-points" id="photoprint-apply-points-btn" onclick="applyPoints('photoprint')">
                                <i class="fas fa-star"></i> Apply Points
                            </button>
                            <button type="button" class="btn-remove-points" id="photoprint-remove-points-btn" onclick="removePoints('photoprint')" style="display: none;">
                                <i class="fas fa-times"></i> Remove Points
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div class="footer-controls">
            <button class="cancel-btn" id="cancelBtn">Cancel</button>
            <button class="calculate-btn" id="calculateBtn">Calculate Price</button>
            <button class="print-btn" id="printBtn" disabled>Print</button>
        </div>
    </div>
</div>
<script>
// Add a safe JSON parser to prevent "<!DOCTYPE" HTML parsing errors
async function parseJsonResponse(response) {
    const contentType = response.headers.get('content-type') || '';
    const text = await response.text();
    if (contentType.includes('application/json')) {
        try { return JSON.parse(text); } catch (e) { throw new Error('Invalid JSON from server'); }
    }
    // If HTML returned (e.g., auth redirect/403), surface a clearer error
    const snippet = text.slice(0, 120).replace(/\s+/g, ' ').trim();
    throw new Error(snippet || 'Unexpected non-JSON response');
}
// --- Layout and slot sizes for each orientation ---
const layoutSlotSizes = {
    portrait: {
        1:  [{w:2480, h:3508}],
        2:  [{w:2480, h:1754}, {w:2480, h:1754}],
        4:  Array(4).fill({w:1240, h:1754}),
        6:  Array(6).fill({w:1240, h:1169}),
        9:  Array(9).fill({w:826, h:1169})
    },
    landscape: {
        1:  [{w:3508, h:2480}],
        2:  [{w:1754, h:2480}, {w:1754, h:2480}],
        4:  Array(4).fill({w:1754, h:1240}),
        6:  Array(6).fill({w:1169, h:1240}),
        9:  Array(9).fill({w:1169, h:826})
    }
};
const a4Dims = {
    portrait: {w:2480, h:3508, canvasW:300, canvasH:400},
    landscape: {w:3508, h:2480, canvasW:400, canvasH:300}
};
let uploadedImages = [];
let currentLayout = 1;
let currentOrientation = 'portrait';
let selectedShop = '';
let availableShops = [];
const uploadBtn = document.getElementById('uploadBtn');
const fileInput = document.getElementById('fileInput');
const photosCount = document.getElementById('photosCount');
const thumbnailsGrid = document.getElementById('thumbnailsGrid');
const a4Canvas = document.getElementById('a4Canvas');
const layoutBtns = document.querySelectorAll('.layout-btn');
const printBtn = document.getElementById('printBtn');
const cancelBtn = document.getElementById('cancelBtn');
const calculateBtn = document.getElementById('calculateBtn');
const shopSelect = document.getElementById('shopSelect');
const pricingSummary = document.getElementById('pricingSummary');
const pricingDetails = document.getElementById('pricingDetails');
const orientationSelect = document.getElementById('orientation');
function loadShops() {
    fetch('/get-available-shops/', {headers: {'X-CSRFToken': getCookie('csrftoken')}})
        .then(r=>r.json())
        .then(data=>{
            if(data.success && data.shops.length>0){
                availableShops = data.shops;
            } else {
                availableShops = [];
            }
            renderPhotoShopDropdown();
        })
        .catch(()=>{ availableShops = []; renderPhotoShopDropdown(); });
}

function renderPhotoShopDropdown() {
    const photoList = document.getElementById('photo-shop-list');
    const photoTrigger = document.getElementById('photo-shop-trigger');
    if (!photoList || !photoTrigger) return;
    
    if (!availableShops || availableShops.length === 0) {
        photoList.innerHTML = '<div style="padding:8px 10px; color:#6b7280;">No shops available</div>';
        selectedShop = '';
        shopSelect.value = '';
        return;
    }

    const listHtml = availableShops.map(s => {
        const distanceKm = (typeof s.distanceKm === 'number') ? s.distanceKm : null;
        const formattedDistance = distanceKm !== null ? (distanceKm < 1 ? `${Math.round(distanceKm * 1000)} m` : `${distanceKm.toFixed(1)} km`) : (s.formattedDistance || (s.distance_km ? `${Number(s.distance_km).toFixed(1)} km` : ''));
        const address = [s.address_line1, s.address_line2, s.city, s.state, s.postal_code].filter(Boolean).join(', ') || [s.area, s.city].filter(Boolean).join(', ');
        return `
          <div class="shop-row" data-shop="${s.shop_folder}" data-lat="${s.latitude || ''}" data-lng="${s.longitude || ''}" data-vendor_email="${s.vendor_email || ''}">
            <div class="row-left">

function positionPhotoPanel() {
    const photoTrigger = document.getElementById('photo-shop-trigger');
    const photoPanel = document.getElementById('photo-shop-panel');
    if (!photoTrigger || !photoPanel) return;
    
    const rect = photoTrigger.getBoundingClientRect();
    const viewportWidth = Math.max(document.documentElement.clientWidth || 0, window.innerWidth || 0);
    const panelWidth = Math.min(420, viewportWidth - 24);
    const centeredLeft = Math.round(rect.left + (rect.width / 2) - (panelWidth / 2));
    const clampedLeft = Math.max(12, Math.min(centeredLeft, viewportWidth - panelWidth - 12));
    
    photoPanel.style.width = panelWidth + 'px';
    photoPanel.style.left = clampedLeft + 'px';
    photoPanel.style.top = Math.round(rect.bottom + 8) + 'px';
}

function updatePreview() {
    // Set canvas size for orientation
    const dims = a4Dims[currentOrientation];
    a4Canvas.width = dims.canvasW;
    a4Canvas.height = dims.canvasH;
    const ctx = a4Canvas.getContext('2d');
    ctx.clearRect(0,0,dims.canvasW,dims.canvasH);
    ctx.fillStyle = '#fff';
    ctx.fillRect(0,0,dims.canvasW,dims.canvasH);
    
    // Draw grid slots
    let cols, rows;
    switch(currentLayout) {
        case 1: cols=1; rows=1; break;
        case 2: cols=(currentOrientation==='portrait'?1:2); rows=(currentOrientation==='portrait'?2:1); break;
        case 4: cols=2; rows=2; break;
        case 6: cols=(currentOrientation==='portrait'?2:3); rows=(currentOrientation==='portrait'?3:2); break;
        case 9: cols=3; rows=3; break;
        default: cols=1; rows=1;
    }
    const slotW = dims.canvasW/cols;
    const slotH = dims.canvasH/rows;
    
    for(let i=0; i<currentLayout; i++){
        const x = (i%cols)*slotW;
        const y = Math.floor(i/cols)*slotH;
        
        ctx.save();
        
        if(i < uploadedImages.length && uploadedImages[i]){
            // Draw filled slot with actual image
            ctx.strokeStyle = '#2563eb';
            ctx.lineWidth = 1.2;
            ctx.strokeRect(x+2,y+2,slotW-4,slotH-4);
            
            const img = uploadedImages[i];
            const image = new window.Image();
            image.src = img.data;
            image.onload = function() {
                // Fit image in slot, keep aspect ratio
                const aspect = image.width/image.height;
                const slotAspect = slotW/slotH;
                let drawW, drawH, dx, dy;
                if(aspect>slotAspect){
                    drawW = slotW-8;
                    drawH = drawW/aspect;
                }else{
                    drawH = slotH-8;
                    drawW = drawH*aspect;
                }
                dx = x+((slotW-drawW)/2);
                dy = y+((slotH-drawH)/2);
                ctx.drawImage(image,dx,dy,drawW,drawH);
            }
        } else {
            // Draw empty slot with dashed border
            ctx.strokeStyle = '#d1d5db';
            ctx.lineWidth = 1;
            ctx.setLineDash([5, 5]);
            ctx.strokeRect(x+2,y+2,slotW-4,slotH-4);
            
            // Add "Empty" text
            ctx.fillStyle = '#9ca3af';
            ctx.font = '12px Arial';
            ctx.textAlign = 'center';
            ctx.fillText('Empty', x + slotW/2, y + slotH/2);
        }
        
        ctx.restore();
    }
}
async function createPDF() {
    const { jsPDF } = window.jspdf;
    const dims = a4Dims[currentOrientation];
    const pdf = new jsPDF(currentOrientation==='portrait'?'p':'l', 'pt', [dims.w, dims.h]);
    
    // Set white background
    pdf.setFillColor(255, 255, 255);
    pdf.rect(0, 0, dims.w, dims.h, 'F');
    
    let cols, rows;
    switch(currentLayout) {
        case 1: cols=1; rows=1; break;
        case 2: cols=(currentOrientation==='portrait'?1:2); rows=(currentOrientation==='portrait'?2:1); break;
        case 4: cols=2; rows=2; break;
        case 6: cols=(currentOrientation==='portrait'?2:3); rows=(currentOrientation==='portrait'?3:2); break;
        case 9: cols=3; rows=3; break;
        default: cols=1; rows=1;
    }
    
    const margin = 20;
    const spacing = 10;
    const totalWidth = dims.w - (2 * margin);
    const totalHeight = dims.h - (2 * margin);
    const slotW = (totalWidth - ((cols - 1) * spacing)) / cols;
    const slotH = (totalHeight - ((rows - 1) * spacing)) / rows;
    
    // Process only available uploaded images, don't replicate
    const availableImages = uploadedImages.length;
    
    for(let i = 0; i < currentLayout; i++){
        const col = i % cols;
        const row = Math.floor(i / cols);
        const x = margin + col * (slotW + spacing);
        const y = margin + row * (slotH + spacing);
        
        if(i < availableImages && uploadedImages[i]){
            // Add actual image to slot
            const img = uploadedImages[i];
            await new Promise(resolve => {
                const image = new Image();
                image.onload = function() {
                    try {
                        // Calculate dimensions to fit image in slot while maintaining aspect ratio
                        const imgAspect = image.width / image.height;
                        const slotAspect = slotW / slotH;
                        let drawW, drawH, dx, dy;
                        
                        if(imgAspect > slotAspect){
                            drawW = slotW - 8;
                            drawH = drawW / imgAspect;
                        } else {
                            drawH = slotH - 8;
                            drawW = drawH * imgAspect;
                        }
                        
                        dx = x + ((slotW - drawW) / 2);
                        dy = y + ((slotH - drawH) / 2);
                        
                        // Add image to PDF
                        pdf.addImage(image, 'JPEG', dx, dy, drawW, drawH);
                        
                        // Add border around image
                        pdf.setDrawColor(100, 100, 100);
                        pdf.setLineWidth(0.5);
                        pdf.rect(x, y, slotW, slotH);
                        
                        resolve();
                    } catch (error) {
                        console.error('Error adding image to PDF:', error);
                        resolve();
                    }
                };
                image.onerror = function() {
                    console.error('Error loading image for PDF');
                    resolve();
                };
                image.src = img.data;
            });
        } else {
            // Draw empty slot with dashed border
            pdf.setDrawColor(200, 200, 200);
            pdf.setLineWidth(1);
            pdf.setLineDashPattern([3, 3], 0);
            pdf.rect(x, y, slotW, slotH);
            pdf.setLineDashPattern([], 0); // Reset dash pattern
            
            // Add "Empty Slot" text in light gray
            pdf.setFontSize(10);
            pdf.setTextColor(180, 180, 180);
            pdf.text('Empty Slot', x + slotW/2, y + slotH/2, { align: 'center' });
        }
    }
    
    // Add title and info
    pdf.setFontSize(14);
    pdf.setTextColor(0, 0, 0);
    const title = `Photo Print Layout (${availableImages} photos in ${currentLayout} slots)`;
    pdf.text(title, dims.w/2, 30, { align: 'center' });
    
    pdf.setFontSize(10);
    pdf.setTextColor(100, 100, 100);
    const info = `A4 ${currentOrientation.charAt(0).toUpperCase() + currentOrientation.slice(1)} • ${cols}x${rows} Grid Layout • Print Ready`;
    pdf.text(info, dims.w/2, dims.h - 20, { align: 'center' });
    
    return pdf.output('blob');
}

function getCookie(name) {
    let cookieValue = null;
    if (document.cookie && document.cookie !== '') {
        const cookies = document.cookie.split(';');
        for (let cookie of cookies) {
            cookie = cookie.trim();
            if (cookie.substring(0, name.length + 1) === (name + '=')) {
                cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                break;
            }
        }
    }
    return cookieValue;
}

// Commission helper (same logic as dashboard)
function calculatePlatformCommission(serviceKey, vendorPrice) {
    // Default 20% for A4 color-like services
    const commissionRates = {
        a4_print_bw: 0.12,
        a4_print_color: 0.2,
        digital_print_a4: 0.15,
        digital_print_12x18: 0.18,
        gloss_paper_a4: 0.2
    };
    const rate = commissionRates[serviceKey] ?? 0.2;
    const amount = vendorPrice * rate;
    return { rate, amount, total: vendorPrice + amount };
}

async function calculatePhotoPrintPrice() {
    if (!selectedShop) {
        alert('Please select a shop first');
        return;
    }

    if (uploadedImages.length === 0) {
        alert('Please upload at least one photo first');
        return;
    }

    // Get selected vendor email
    const selectedVendor = availableShops.find(shop => shop.shop_folder === selectedShop);
    if (!selectedVendor || !selectedVendor.vendor_email) {
        alert('Unable to get vendor information');
        return;
    }

    // Collect form data for photo print
    const formData = {
        vendor_email: selectedVendor.vendor_email,
        photo_count: uploadedImages.length,
        layout_slots: currentLayout,
        orientation: currentOrientation,
        color: document.getElementById('color').value,
        copies: parseInt(document.getElementById('copies').value) || 1
    };

    console.log('Photo print form data being sent:', formData);

    // Show loading state
    const originalText = calculateBtn.innerHTML;
    calculateBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Calculating...';
    calculateBtn.disabled = true;

    try {
        const response = await fetch('/calculate-photo-print-pricing/', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'X-CSRFToken': getCookie('csrftoken')
            },
            body: JSON.stringify(formData)
        });

        const result = await response.json();

        if (result.success) {
            // Apply platform commission silently (same approach as dashboard)
            const breakdown = result.pricing_breakdown;
            const vendorPrice = Number(breakdown.total_price || 0);
            // Use A4 color pricing key for photo prints commission model
            const commission = calculatePlatformCommission('a4_print_color', vendorPrice);

            // Build display (do not show commission explicitly)
            let html = '';
            html += `
                <li class="pricing-item">
                    <span class="pricing-label">${breakdown.pricing_key_used.replace(/_/g, ' ').toUpperCase()}</span>
                    <span class="pricing-value">₹${Number(breakdown.base_price || 0)}</span>
                </li>
            `;
            html += `
                <li class="pricing-item">
                    <span class="pricing-label">Number of photos</span>
                    <span class="pricing-value">${breakdown.photo_count}</span>
                </li>
                <li class="pricing-item">
                    <span class="pricing-label">Layout slots</span>
                    <span class="pricing-value">${breakdown.layout_slots}</span>
                </li>
                <li class="pricing-item">
                    <span class="pricing-label">Number of copies</span>
                    <span class="pricing-value">${breakdown.copies}</span>
                </li>
            `;

            // Effective per-photo after adding commission
            const items = (Number(breakdown.photo_count || 1) * Number(breakdown.copies || 1)) || 1;
            const basePer = Number(breakdown.price_per_page || 0);
            const effectivePer = (basePer + (items ? (commission.amount / items) : 0)).toFixed(2);
            if (basePer) {
              html += `
                <li class="pricing-item">
                  <span class="pricing-label">Price per photo</span>
                  <span class="pricing-value">₹${effectivePer}</span>
                </li>
              `;
            }

            html += `
                <li class="pricing-item total">
                    <i class="fas fa-check-circle"></i>
                    <span class="pricing-label">Total Amount</span>
                    <span class="pricing-value">₹${Number(commission.total).toFixed(2)}</span>
                </li>
            `;

            pricingDetails.innerHTML = html;
            pricingSummary.style.display = 'block';

            // Show points section if user has points
            showPointsSection('photoprint');

            // Store calculated price + breakdown in page dataset for submit
            const finalBreakdown = { ...breakdown };
            finalBreakdown.total_price = Number(commission.total).toFixed(2);
            document.body.dataset.calculatedPrice = finalBreakdown.total_price;
            document.body.dataset.pricingBreakdown = JSON.stringify(finalBreakdown);

        } else {
            alert('Error calculating price: ' + (result.error || 'Unknown error'));
        }
    } catch (error) {
        console.error('Error calculating photo print price:', error);
        alert('Error calculating price. Please try again.');
    } finally {
        // Restore button state
        calculateBtn.innerHTML = originalText;
        calculateBtn.disabled = false;
    }
}
async function handlePrint() {

            } catch (error) {

            }
        } else {

        }
        
        // Create comprehensive metadata similar to other modals
        const metadata = {

            service_type: 'photo_print',

        // Add points information if points were applied

            });
            rzp.on('payment.failed', function (resp) {
                alert('Payment failed: ' + (resp.error && resp.error.description ? resp.error.description : 'Please try again.'));
                resolve();
            });
            rzp.open();
        });
    } catch (error) {
        console.error('Error:', error);
        alert(`Error: ${error.message}`);
    } finally {
        printBtn.disabled = false;
        printBtn.textContent = 'Print';
    }
}

function getGridLayoutString(layout, orientation) {
    let cols, rows;
    switch(layout) {
        case 1: cols=1; rows=1; break;
        case 2: cols=(orientation==='portrait'?1:2); rows=(orientation==='portrait'?2:1); break;
        case 4: cols=2; rows=2; break;
        case 6: cols=(orientation==='portrait'?2:3); rows=(orientation==='portrait'?3:2); break;
        case 9: cols=3; rows=3; break;
        default: cols=1; rows=1;
    }
    return `${cols}x${rows}`;
}
// Points Application Functions
let userPoints = 0;
let pointsApplied = false;
let pointsUsed = 0;

// Load user points on page load
async function loadUserPoints() {
    try {
        const response = await fetch('/get-user-points/', {
            method: 'GET',
            headers: {
                'X-CSRFToken': getCookie('csrftoken')
            }
        });
        const data = await response.json();
        if (data.success) {
            userPoints = data.total_points || 0;
            updatePointsDisplay();
        }
    } catch (error) {
        console.error('Error loading user points:', error);
    }
}

// Update points display in all modals
function updatePointsDisplay() {
    const pointsSections = document.querySelectorAll('.points-section');
    pointsSections.forEach(section => {
        const availablePoints = section.querySelector('.points-available span');
        const pointsBalance = section.querySelector('.points-balance span');
        
        if (availablePoints) {
            availablePoints.textContent = userPoints;
        }
        
        if (pointsBalance) {
            const remainingPoints = Math.max(0, userPoints - pointsUsed);
            pointsBalance.textContent = remainingPoints;
        }
    });
}

// Apply points to a specific service modal
async function applyPoints(service) {
    let modal = document.querySelector('.card-modal');
    if (!modal) return;

    const calculatedPrice = parseFloat(document.body.dataset.calculatedPrice);
    if (!calculatedPrice || calculatedPrice <= 0) {
        alert('Please calculate the price first');
        return;
    }

    // Calculate maximum points that can be used (ensure at least 1 rupee remains)
    const maxPointsToUse = Math.min(userPoints, Math.floor(calculatedPrice - 1));
    
    if (maxPointsToUse <= 0) {
        alert('Not enough points to apply. You need at least 1 rupee remaining after applying points.');
        return;
    }

    // Use all available points up to the maximum
    pointsUsed = maxPointsToUse;
    const finalAmount = calculatedPrice - pointsUsed;

    // Update local userPoints variable immediately
    userPoints = Math.max(0, userPoints - pointsUsed);

    // Update the pricing display
    updatePricingWithPoints(service, calculatedPrice, pointsUsed, finalAmount);

    // Update points section
    const pointsSection = modal.querySelector(`#${service}-points-section`);
    if (pointsSection) {
        pointsSection.style.display = 'block';
        pointsSection.classList.add('points-applied');
        
        const applyBtn = modal.querySelector(`#${service}-apply-points-btn`);
        const removeBtn = modal.querySelector(`#${service}-remove-points-btn`);
        
        if (applyBtn) applyBtn.style.display = 'none';
        if (removeBtn) removeBtn.style.display = 'flex';
    }

    // Update points display immediately
    updatePointsDisplay();

    // Store points application data
    modal.dataset.pointsApplied = 'true';
    modal.dataset.pointsUsed = pointsUsed.toString();
    modal.dataset.finalAmount = finalAmount.toString();

    alert(`Points Applied: ${pointsUsed} points. Final amount: ₹${finalAmount.toFixed(2)}`);
}

// Remove points from a specific service modal
function removePoints(service) {
    let modal = document.querySelector('.card-modal');
    if (!modal) return;

    const originalPrice = parseFloat(document.body.dataset.calculatedPrice);
    if (!originalPrice) return;

    // Get the points that were used to restore them
    const pointsToRestore = parseInt(modal.dataset.pointsUsed || '0');
    
    // Reset points
    pointsUsed = 0;

    // Restore points to userPoints variable
    userPoints = userPoints + pointsToRestore;

    // Update the pricing display back to original
    updatePricingWithPoints(service, originalPrice, 0, originalPrice);

    // Update points section
    const pointsSection = modal.querySelector(`#${service}-points-section`);
    if (pointsSection) {
        pointsSection.classList.remove('points-applied');
        
        const applyBtn = modal.querySelector(`#${service}-apply-points-btn`);
        const removeBtn = modal.querySelector(`#${service}-remove-points-btn`);
        
        if (applyBtn) applyBtn.style.display = 'flex';
        if (removeBtn) removeBtn.style.display = 'none';
    }

    // Update points display immediately
    updatePointsDisplay();

    // Clear points application data
    modal.dataset.pointsApplied = 'false';
    modal.dataset.pointsUsed = '0';
    modal.dataset.finalAmount = originalPrice.toString();

    alert('Points removed. Original amount restored.');
}

// Update pricing display with points applied
function updatePricingWithPoints(service, originalPrice, pointsUsed, finalAmount) {
    const pricingDetails = document.getElementById('pricingDetails');
    if (!pricingDetails) return;

    // Find the total amount line and update it
    const totalItem = pricingDetails.querySelector('.pricing-item.total');
    if (totalItem) {
        // Remove any existing points line
        const existingPointsLine = pricingDetails.querySelector('.pricing-item.points-applied');
        if (existingPointsLine) {
            existingPointsLine.remove();
        }

        // Add points applied line before total
        if (pointsUsed > 0) {
            const pointsLine = document.createElement('li');
            pointsLine.className = 'pricing-item points-applied';
            pointsLine.innerHTML = `
                <span class="pricing-label">Points Applied</span>
                <span class="pricing-value">-₹${pointsUsed.toFixed(2)}</span>
            `;
            totalItem.parentNode.insertBefore(pointsLine, totalItem);
        }

        // Update total amount
        const totalValue = totalItem.querySelector('.pricing-value');
        if (totalValue) {
            totalValue.textContent = `₹${finalAmount.toFixed(2)}`;
        }
    }
}

// Show points section when pricing is calculated
function showPointsSection(service) {
    let modal = document.querySelector('.card-modal');
    if (!modal) return;

    const pointsSection = modal.querySelector(`#${service}-points-section`);
    if (pointsSection && userPoints > 0) {
        pointsSection.style.display = 'block';
        updatePointsDisplay();
    }
}
