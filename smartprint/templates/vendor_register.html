<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Join PrintMe - Partner Registration</title>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: #eaf3fb;
            color: #1e293b;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }

        .modal-container {
            display: flex;
            max-width: 900px;
            width: 100%;
            min-height: 340px;
            border-radius: 1.2rem;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.13);
            background: #ffffff;
            overflow: hidden;
            animation: modalPop 0.7s cubic-bezier(0.68, -0.55, 0.27, 1.55);
        }

        @keyframes modalPop {
            0% { transform: scale(0.95) translateY(50px); opacity: 0; }
            100% { transform: scale(1) translateY(0); opacity: 1; }
        }

        .modal-left {
            background: #2563eb;
            color: #ffffff;
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2.2rem 1.5rem;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .modal-left::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: 
                radial-gradient(circle, rgba(255,255,255,0.15) 0%, transparent 50%),
                radial-gradient(circle at 80% 20%, rgba(255,255,255,0.1) 0%, transparent 60%);
            animation: headerPulse 8s ease-in-out infinite;
        }

        @keyframes headerPulse {
            0%, 100% { transform: scale(1) rotate(0deg); opacity: 0.5; }
            50% { transform: scale(1.1) rotate(180deg); opacity: 0.2; }
        }

        .header-content {
            position: relative;
            z-index: 2;
        }

        .header h1 {
            font-family: 'Poppins', sans-serif;
            font-size: 2.8rem;
            font-weight: 700;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 16px;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.3);
        }

        .header .material-icons {
            font-size: 3rem;
            filter: drop-shadow(0 2px 8px rgba(0, 0, 0, 0.3));
        }

        .header p {
            font-size: 1.2rem;
            opacity: 0.95;
            font-weight: 300;
            text-shadow: 0 1px 3px rgba(0, 0, 0, 0.3);
        }

        .form-container {
            padding: 50px 40px;
            background: rgba(255, 255, 255, 0.98);
        }

        .success-message {
            display: none;
            background: linear-gradient(135deg, var(--success-green), #66BB6A);
            color: white;
            padding: 25px;
            border-radius: 16px;
            text-align: center;
            margin-bottom: 35px;
            animation: slideIn 0.6s ease;
            box-shadow: 0 8px 25px rgba(76, 175, 80, 0.3);
        }

        @keyframes slideIn {
            from { transform: translateY(-30px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            margin-bottom: 35px;
        }

        .form-group {
            position: relative;
        }

        .form-group.full-width {
            grid-column: 1 / -1;
        }

        .form-group label {
            display: block;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 10px;
            font-size: 1rem;
            letter-spacing: 0.5px;
        }

        .input-container {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-container .material-icons {
            position: absolute;
            left: 18px;
            color: var(--text-hint);
            font-size: 22px;
            z-index: 3;
            transition: all 0.3s ease;
        }

        .form-control {
            width: 100%;
            padding: 18px 18px 18px 58px;
            border: 2px solid var(--divider);
            border-radius: 16px;
            font-size: 1.1rem;
            background: rgba(255, 255, 255, 0.9);
            color: var(--text-primary);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            outline: none;
            backdrop-filter: blur(10px);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
        }

        .form-control:focus {
            border-color: var(--primary-blue);
            box-shadow: 
                0 0 0 4px rgba(25, 118, 210, 0.15),
                0 4px 12px rgba(25, 118, 210, 0.1);
            background: rgba(255, 255, 255, 1);
            transform: translateY(-2px);
        }

        .form-control:focus + .material-icons {
            color: var(--primary-blue);
            transform: scale(1.1);
        }

        /* Location icon specific styles */
        .location-icon {
            cursor: pointer !important;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1) !important;
        }

        .location-icon:hover {
            color: var(--primary-blue) !important;
            transform: scale(1.2) !important;
        }

        .location-icon:active {
            transform: scale(0.95) !important;
        }

        /* Loading state for location icon */
        .location-icon[style*="opacity: 0.7"] {
            animation: pulse 1.5s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.7; }
            50% { opacity: 1; }
        }

        /* Notification styles */
        .location-notification {
            position: fixed;
            top: 20px;
            right: 20px;
            background: white;
            color: var(--text-primary);
            padding: 16px 20px;
            border-radius: 12px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.15);
            display: flex;
            align-items: center;
            gap: 12px;
            z-index: 1000;
            animation: slideInRight 0.4s ease;
            max-width: 350px;
            border-left: 4px solid var(--primary-blue);
        }

        .location-notification.success {
            border-left-color: var(--success-green);
            background: linear-gradient(135deg, #E8F5E8, #F1F8E9);
        }

        .location-notification.error {
            border-left-color: var(--error-red);
            background: linear-gradient(135deg, #FFEBEE, #FFCDD2);
        }

        .location-notification .material-icons {
            font-size: 20px;
        }

        .location-notification.success .material-icons {
            color: var(--success-green);
        }

        .location-notification.error .material-icons {
            color: var(--error-red);
        }

        @keyframes slideInRight {
            from {
                transform: translateX(100%);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        .form-control.error {
            border-color: #ef4444;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
        }

        .error-message {
            color: #ef4444;
            font-size: 0.82rem;
            margin-top: 0.3rem;
            display: none;
        }

        .password-strength {
            margin-top: 0.4rem;
        }

        .strength-bar {
            height: 4px;
            background: #e2e8f0;
            border-radius: 2px;
            overflow: hidden;
            margin-bottom: 0.3rem;
        }

        .strength-fill {
            height: 100%;
            background: #ef4444;
            transition: all 0.3s ease;
            width: 0%;
        }

        .strength-fill.medium {
            background: #f59e0b;
        }

        .strength-fill.strong {
            background: #10b981;
        }

        .strength-text {
            font-size: 0.8rem;
            color: #64748b;
        }

        .toggle-password {
            position: absolute;
            right: 1rem;
            top: 2.3rem;
            cursor: pointer;
            color: #6b7280;
            font-size: 1.1rem;
            z-index: 2;
            transition: color 0.2s;
        }

        .toggle-password:hover {
            color: #2563eb;
        }

        .submit-btn {
            width: 100%;
            padding: 1rem;
            background: #2563eb;
            color: #ffffff;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 1.1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.10);
        }

        .submit-btn:hover {
            background: #3b82f6;
            transform: translateY(-1px);
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.13);
        }

        .submit-btn:disabled {
            background: #9ca3af;
            cursor: not-allowed;
            transform: none;
        }

        .loading-spinner {
            display: none;
            width: 18px;
            height: 18px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-top: 2px solid #ffffff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .success-message {
            display: none;
            background: #10b981;
            color: #ffffff;
            padding: 1.2rem;
            border-radius: 10px;
            text-align: center;
            margin-bottom: 1.2rem;
            animation: slideIn 0.5s ease;
        }

        @keyframes slideIn {
            from { transform: translateY(-10px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .back-link {
            text-align: center;
            margin-top: 1.2rem;
            padding-top: 1rem;
            border-top: 1px solid #e2e8f0;
        }

        .back-link a {
            color: #3b82f6;
            text-decoration: none;
            font-weight: 500;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            transition: color 0.3s ease;
        }

        .back-link a:hover {
            color: #1e3a8a;
        }

        .progress-bar {
            background: #e2e8f0;
            height: 4px;
            border-radius: 2px;
            overflow: hidden;
            margin-bottom: 1.2rem;
        }

        .progress-fill {
            height: 100%;
            background: #3b82f6;
            transition: width 0.3s ease;
            width: 0%;
        }

        @media (max-width: 900px) {
            .modal-container {
                flex-direction: column;
                max-width: 98%;
                min-height: unset;
                border-radius: 1rem;
            }

            .modal-left, .modal-right {
                padding: 1.2rem 1rem;
            }

            .modal-left .logo {
                font-size: 1.5rem;
            }

            .modal-left .tagline {
                font-size: 1.1rem;
            }
        }

        @media (max-width: 480px) {
            body {
                padding: 10px 5px;
            }

            .header h1 {
                font-size: 1.9rem;
            }

            .header p {
                font-size: 1rem;
            }

            .form-container {
                padding: 30px 20px;
            }

            .form-control {
                padding: 14px 14px 14px 48px;
            }

            .submit-btn, .pricing-btn {
                font-size: 1rem;
            }
            .password-strength {
                font-size: 0.85rem;
            }
            .strength-bar {
                height: 5px;
            }
            .strength-text {
                font-size: 0.8rem;
            }
        }

        /* Improved scrolling */
        html, body {
            scroll-behavior: smooth;
            overflow-x: hidden;
        }

        /* Enhanced focus states for accessibility */
        .form-control:focus-visible {
            outline: 3px solid rgba(25, 118, 210, 0.5);
            outline-offset: 2px;
        }

        .submit-btn:focus-visible,
        .pricing-btn:focus-visible {
            outline: 3px solid rgba(255, 255, 255, 0.5);
            outline-offset: 2px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="header-content">
                <h1>
                    <span class="material-icons">store</span>
                    Join PrintMe
                </h1>
                <p>Register your printing shop with us and reach more customers</p>
            </div>
        </div>

        <div class="form-container">
            <div class="success-message" id="successMessage">
                <span class="material-icons">check_circle</span>
                Registration successful! Setting up your dashboard...
            </div>
            <form id="vendorRegisterForm" onsubmit="handleRegistration(event)">
                {% csrf_token %}

                <div class="form-grid">
                    <div class="form-group">
                        <label for="email">Email Address *</label>
                        <div class="input-container">
                            <input type="email" class="form-control" id="email" name="email" required>
                            <span class="material-icons">email</span>
                        </div>
                        <div class="error-message" id="emailError"></div>
                    </div>

                    <div class="form-group">
                        <label for="vendorName">Shop Name *</label>
                        <div class="input-container">
                            <input type="text" class="form-control" id="vendorName" name="vendorName" required>
                            <span class="material-icons">store</span>
                        </div>
                        <div class="error-message" id="vendorNameError"></div>
                    </div>
                </div>

                <div class="form-grid">
                    <div class="form-group">
                        <label for="password">Password *</label>
                        <input type="password" class="form-control" id="password" name="password" required>
                        <span class="material-icons toggle-password" id="togglePassword">visibility_off</span>
                        <div class="password-strength">
                            <div class="strength-bar">
                                <div class="strength-fill" id="strengthFill"></div>
                            </div>
                            <div class="strength-text" id="strengthText">Password strength: Weak</div>
                        </div>
                        <div class="error-message" id="passwordError"></div>
                    </div>
                    <div class="form-group" style="position:relative;">
                        <label for="confirmPassword">Confirm Password *</label>
                        <input type="password" class="form-control" id="confirmPassword" name="confirmPassword" required>
                        <span class="material-icons toggle-password" id="toggleConfirmPassword">visibility_off</span>
                        <div class="error-message" id="confirmPasswordError"></div>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="phoneNumber">Phone Number *</label>
                        <input type="tel" class="form-control" id="phoneNumber" name="phoneNumber" required>
                        <div class="error-message" id="phoneNumberError"></div>
                    </div>
                    <div class="form-group">
                        <label for="city">City *</label>
                        <input type="text" class="form-control" id="city" name="city" required>
                        <div class="error-message" id="cityError"></div>
                    </div>
                </div>
                <div class="form-group">
                    <label for="shopAddress">Shop Address *</label>
                    <div class="input-container">
                        <input type="text" class="form-control" id="shopAddress" name="shopAddress" required placeholder="Click the location icon to get your address automatically, or type manually">
                        <span class="material-icons location-icon" id="locationIcon" style="cursor: pointer;" title="Click to get current location">location_on</span>
                    </div>
                    <div class="error-message" id="shopAddressError"></div>
                </div>
                <div class="form-group">
                    <label for="pincode">PIN Code *</label>
                    <input type="text" class="form-control" id="pincode" name="pincode" required maxlength="6">
                    <div class="error-message" id="pincodeError"></div>
                </div>

                <input type="hidden" id="latitude" name="latitude">
                <input type="hidden" id="longitude" name="longitude">

                <button type="submit" class="submit-btn" id="submitBtn">
                    <span class="loading-spinner" id="loadingSpinner"></span>
                    <span class="material-icons">rocket_launch</span>
                    Join PrintMax Now
                </button>
            </form>
            <div class="back-link">
                <a href="/login/">
                    <span class="material-icons">arrow_back</span>
                    Back to Login
                </a>
            </div>
        </div>
    </div>
    <script>
        // Progress tracking
        function updateProgress() {
            const inputs = document.querySelectorAll('.form-control');
            let filled = 0;
            inputs.forEach(input => {
                if (input.value.trim()) filled++;
            });
            const progress = (filled / inputs.length) * 100;
            document.getElementById('progressFill').style.width = progress + '%';
        }
        document.querySelectorAll('.form-control').forEach(input => {
            input.addEventListener('input', updateProgress);
        });
        // Get CSRF token
        function getCookie(name) {
            let cookieValue = null;
            if (document.cookie && document.cookie !== '') {
                const cookies = document.cookie.split(';');
                for (let i = 0; i < cookies.length; i++) {
                    const cookie = cookies[i].trim();
                    if (cookie.substring(0, name.length + 1) === (name + '=')) {
                        cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                        break;
                    }
                }
            }
            return cookieValue;
        }
        // Password strength checker
        function checkPasswordStrength(password) {
            let strength = 0;
            if (password.length >= 8) strength += 1;
            if (/[a-zA-Z]/.test(password)) strength += 1;
            if (/[0-9]/.test(password)) strength += 1;
            if (/[^A-Za-z0-9]/.test(password)) strength += 1;
            return strength;
        }
        function updatePasswordStrength(password) {
            const strength = checkPasswordStrength(password);
            const strengthFill = document.getElementById('strengthFill');
            const strengthText = document.getElementById('strengthText');
            strengthFill.className = 'strength-fill';
            if (strength <= 1) {
                strengthFill.style.width = '25%';
                strengthText.textContent = 'Password strength: Weak';
            } else if (strength <= 2) {
                strengthFill.style.width = '50%';
                strengthFill.classList.add('medium');
                strengthText.textContent = 'Password strength: Fair';
            } else if (strength <= 3) {
                strengthFill.style.width = '75%';
                strengthFill.classList.add('medium');
                strengthText.textContent = 'Password strength: Good';
            } else {
                strengthFill.style.width = '100%';
                strengthFill.classList.add('strong');
                strengthText.textContent = 'Password strength: Strong';
            }
        }
        // Password eye toggle
        function setupPasswordToggle(inputId, toggleId) {
            const input = document.getElementById(inputId);
            const toggle = document.getElementById(toggleId);
            toggle.addEventListener('click', function() {
                if (input.type === 'password') {
                    input.type = 'text';
                    toggle.textContent = 'visibility';
                } else {
                    input.type = 'password';
                    toggle.textContent = 'visibility_off';
                }
            });
        }
        setupPasswordToggle('password', 'togglePassword');
        setupPasswordToggle('confirmPassword', 'toggleConfirmPassword');
        // Validation functions
        function validateEmail() {
            const email = document.getElementById('email').value;
            const emailError = document.getElementById('emailError');
            const emailField = document.getElementById('email');
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (!email) {
                showError(emailField, emailError, 'Email is required');
                return false;
            } else if (!emailRegex.test(email)) {
                showError(emailField, emailError, 'Please enter a valid email address');
                return false;
            } else {
                hideError(emailField, emailError);
                return true;
            }
        }
        function validatePassword() {
            const password = document.getElementById('password').value;
            const passwordError = document.getElementById('passwordError');
            const passwordField = document.getElementById('password');
            const strength = checkPasswordStrength(password);
            if (!password) {
                showError(passwordField, passwordError, 'Password is required');
                return false;
            } else if (strength < 2) {
                showError(passwordField, passwordError, 'Password must be at least 8 characters with letters and numbers');
                return false;
            } else {
                hideError(passwordField, passwordError);
                return true;
            }
        }
        function validateConfirmPassword() {
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const confirmPasswordError = document.getElementById('confirmPasswordError');
            const confirmPasswordField = document.getElementById('confirmPassword');
            if (!confirmPassword) {
                showError(confirmPasswordField, confirmPasswordError, 'Please confirm your password');
                return false;
            } else if (password !== confirmPassword) {
                showError(confirmPasswordField, confirmPasswordError, 'Passwords do not match');
                return false;
            } else {
                hideError(confirmPasswordField, confirmPasswordError);
                return true;
            }
        }
        function validateVendorName() {
            const vendorName = document.getElementById('vendorName').value;
            const vendorNameError = document.getElementById('vendorNameError');
            const vendorNameField = document.getElementById('vendorName');
            if (!vendorName.trim()) {
                showError(vendorNameField, vendorNameError, 'Shop name is required');
                return false;
            } else if (vendorName.trim().length < 2) {
                showError(vendorNameField, vendorNameError, 'Shop name must be at least 2 characters');
                return false;
            } else {
                hideError(vendorNameField, vendorNameError);
                return true;
            }
        }
        function validatePhoneNumber() {
            const phoneNumber = document.getElementById('phoneNumber').value;
            const phoneNumberError = document.getElementById('phoneNumberError');
            const phoneNumberField = document.getElementById('phoneNumber');
            const phoneRegex = /^\d{10}$/;
            if (!phoneNumber) {
                showError(phoneNumberField, phoneNumberError, 'Phone number is required');
                return false;
            } else if (!phoneRegex.test(phoneNumber.replace(/\D/g, ''))) {
                showError(phoneNumberField, phoneNumberError, 'Please enter a valid 10-digit phone number');
                return false;
            } else {
                hideError(phoneNumberField, phoneNumberError);
                return true;
            }
        }

        function validateShopAddress() {
            const shopAddress = document.getElementById('shopAddress').value;
            const shopAddressError = document.getElementById('shopAddressError');
            const shopAddressField = document.getElementById('shopAddress');

            if (!shopAddress.trim()) {
                showError(shopAddressField, shopAddressError, 'Shop address is required');
                return false;
            } else if (shopAddress.trim().length < 10) {
                showError(shopAddressField, shopAddressError, 'Please enter a complete address');
                return false;
            } else {
                hideError(shopAddressField, shopAddressError);
                return true;
            }
        }

        function validateCity() {
            const city = document.getElementById('city').value;
            const cityError = document.getElementById('cityError');
            const cityField = document.getElementById('city');

            if (!city.trim()) {
                showError(cityField, cityError, 'City is required');
                return false;
            } else if (city.trim().length < 2) {
                showError(cityField, cityError, 'Please enter a valid city name');
                return false;
            } else {
                hideError(cityField, cityError);
                return true;
            }
        }

        function validatePincode() {
            const pincode = document.getElementById('pincode').value;
            const pincodeError = document.getElementById('pincodeError');
            const pincodeField = document.getElementById('pincode');
            const pincodeRegex = /^\d{6}$/;
            if (!pincode) {
                showError(pincodeField, pincodeError, 'PIN code is required');
                return false;
            } else if (!pincodeRegex.test(pincode)) {
                showError(pincodeField, pincodeError, 'Please enter a valid 6-digit PIN code');
                return false;
            } else {
                hideError(pincodeField, pincodeError);
                return true;
            }
        }
        function showError(field, errorElement, message) {
            field.classList.add('error');
            errorElement.textContent = message;
            errorElement.style.display = 'block';
        }
        function hideError(field, errorElement) {
            field.classList.remove('error');
            errorElement.style.display = 'none';
        }


        let lastVendorEmail = null;
        let locationStatus = 'pending'; // 'pending', 'success', 'error'

        // Geolocation logic
        function setLocationFields(lat, lng) {
            document.getElementById('latitude').value = lat;
            document.getElementById('longitude').value = lng;
            locationStatus = 'success';
        }

        // Alternative geocoding service (BigDataCloud - free, no API key required)
        async function getAddressFromBigDataCloud(lat, lng) {
            try {
                const response = await fetch(`https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=${lat}&longitude=${lng}&localityLanguage=en&key=`);
                const data = await response.json();
                console.log('BigDataCloud response:', data);
                
                if (data && data.locality) {
                    let addressParts = [];
                    
                    // Build address from available components (English only)
                    if (data.locality) addressParts.push(data.locality);
                    if (data.principalSubdivision) addressParts.push(data.principalSubdivision);
                    if (data.countryName) addressParts.push(data.countryName);
                    if (data.postcode) addressParts.push(data.postcode);
                    
                    return {
                        address: addressParts.join(', '),
                        city: data.locality || data.principalSubdivision || '',
                        pincode: data.postcode || ''
                    };
                }
                return null;
            } catch (error) {
                console.log('BigDataCloud failed:', error);
                return null;
            }
        }

        // Reverse geocoding function to get address from coordinates
        async function getAddressFromCoordinates(lat, lng) {
            try {
                // Try multiple approaches to get the most detailed address
                let bestAddress = null;
                let bestCity = '';
                let bestPincode = '';
                
                // Approach 1: Try with maximum zoom level for street-level detail (English only)
                try {
                    const response1 = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lng}&addressdetails=1&zoom=20&extratags=1&namedetails=1&accept-language=en&addressdetails=1`);
                    const data1 = await response1.json();
                    console.log('High zoom response:', data1);
                    
                    if (data1 && data1.display_name) {
                        // Force English language by checking if address contains non-English characters
                        const displayName = data1.display_name;
                        const hasNonEnglish = /[\u0900-\u097F\u0980-\u09FF\u0A00-\u0A7F\u0A80-\u0AFF\u0B00-\u0B7F\u0B80-\u0BFF\u0C00-\u0C7F\u0C80-\u0CFF\u0D00-\u0D7F\u0D80-\u0DFF\u0E00-\u0E7F\u0E80-\u0EFF\u0F00-\u0FFF]/.test(displayName);
                        
                        if (!hasNonEnglish) {
                            bestAddress = displayName;
                            bestCity = data1.address?.city || data1.address?.town || data1.address?.village || data1.address?.state || '';
                            bestPincode = data1.address?.postcode || '';
                        }
                    }
                } catch (e) {
                    console.log('High zoom failed:', e);
                }
                
                // Approach 2: If first approach didn't work well, try with different parameters (English only)
                if (!bestAddress || bestAddress.split(',').length < 4) {
                    try {
                        const response2 = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lng}&addressdetails=1&zoom=18&extratags=1&namedetails=1&accept-language=en`);
                        const data2 = await response2.json();
                        console.log('Medium zoom response:', data2);
                        
                        if (data2 && data2.display_name) {
                            const displayName = data2.display_name;
                            const hasNonEnglish = /[\u0900-\u097F\u0980-\u09FF\u0A00-\u0A7F\u0A80-\u0AFF\u0B00-\u0B7F\u0B80-\u0BFF\u0C00-\u0C7F\u0C80-\u0CFF\u0D00-\u0D7F\u0D80-\u0DFF\u0E00-\u0E7F\u0E80-\u0EFF\u0F00-\u0FFF]/.test(displayName);
                            
                            if (!hasNonEnglish && displayName.split(',').length > (bestAddress ? bestAddress.split(',').length : 0)) {
                                bestAddress = displayName;
                                bestCity = data2.address?.city || data2.address?.town || data2.address?.village || data2.address?.state || '';
                                bestPincode = data2.address?.postcode || '';
                            }
                        }
                    } catch (e) {
                        console.log('Medium zoom failed:', e);
                    }
                }
                
                // Approach 3: Try with different service (English only)
                if (!bestAddress || bestAddress.split(',').length < 4) {
                    try {
                        const response3 = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lng}&addressdetails=1&zoom=16&extratags=1&namedetails=1&accept-language=en`);
                        const data3 = await response3.json();
                        console.log('Low zoom response:', data3);
                        
                        if (data3 && data3.display_name) {
                            const displayName = data3.display_name;
                            const hasNonEnglish = /[\u0900-\u097F\u0980-\u09FF\u0A00-\u0A7F\u0A80-\u0AFF\u0B00-\u0B7F\u0B80-\u0BFF\u0C00-\u0C7F\u0C80-\u0CFF\u0D00-\u0D7F\u0D80-\u0DFF\u0E00-\u0E7F\u0E80-\u0EFF\u0F00-\u0FFF]/.test(displayName);
                            
                            if (!hasNonEnglish) {
                                bestAddress = displayName;
                                bestCity = data3.address?.city || data3.address?.town || data3.address?.village || data3.address?.state || '';
                                bestPincode = data3.address?.postcode || '';
                            }
                        }
                    } catch (e) {
                        console.log('Low zoom failed:', e);
                    }
                }
                
                // If we still don't have a good address, try alternative service
                if (!bestAddress || bestAddress.split(',').length < 3) {
                    try {
                        const bigDataResult = await getAddressFromBigDataCloud(lat, lng);
                        if (bigDataResult && bigDataResult.address) {
                            bestAddress = bigDataResult.address;
                            bestCity = bigDataResult.city;
                            bestPincode = bigDataResult.pincode;
                        }
                    } catch (e) {
                        console.log('BigDataCloud fallback failed:', e);
                    }
                }
                
                // Final fallback: construct manually from Nominatim
                if (!bestAddress || bestAddress.split(',').length < 3) {
                    try {
                        const response4 = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lng}&addressdetails=1&zoom=14`);
                        const data4 = await response4.json();
                        console.log('Final fallback response:', data4);
                        
                        if (data4 && data4.address) {
                            const addr = data4.address;
                            let parts = [];
                            
                            // Try to build a detailed address
                            if (addr.house_number) parts.push(addr.house_number);
                            if (addr.road) parts.push(addr.road);
                            if (addr.suburb) parts.push(addr.suburb);
                            if (addr.neighbourhood) parts.push(addr.neighbourhood);
                            if (addr.district) parts.push(addr.district);
                            if (addr.city) parts.push(addr.city);
                            else if (addr.town) parts.push(addr.town);
                            else if (addr.village) parts.push(addr.village);
                            if (addr.state) parts.push(addr.state);
                            if (addr.postcode) parts.push(addr.postcode);
                            
                            if (parts.length > 0) {
                                bestAddress = parts.join(', ');
                                bestCity = addr.city || addr.town || addr.village || addr.state || '';
                                bestPincode = addr.postcode || '';
                            }
                        }
                    } catch (e) {
                        console.log('Final fallback failed:', e);
                    }
                }
                
                // If we have an address, populate the fields
                if (bestAddress) {
                    console.log('Final address:', bestAddress);
                    console.log('Final city:', bestCity);
                    console.log('Final pincode:', bestPincode);
                    
                    // Check if we have a detailed enough address
                    const addressParts = bestAddress.split(',');
                    const hasStreetLevel = addressParts.length >= 4;
                    
                    if (hasStreetLevel) {
                        document.getElementById('shopAddress').value = bestAddress;
                        document.getElementById('city').value = bestCity;
                        document.getElementById('pincode').value = bestPincode;
                        
                        // Trigger validation
                        validateShopAddress();
                        validateCity();
                        validatePincode();
                        
                        return true;
                    } else {
                        // If we don't have street-level detail, show a more informative message
                        showNotification('Location detected! Found: ' + bestAddress + '. Please add street details manually.', 'info');
                        
                        // Still populate what we have
                        document.getElementById('shopAddress').value = bestAddress;
                        document.getElementById('city').value = bestCity;
                        document.getElementById('pincode').value = bestPincode;
                        
                        // Trigger validation
                        validateShopAddress();
                        validateCity();
                        validatePincode();
                        
                        return true;
                    }
                }
                
                return false;
            } catch (error) {
                console.error('Error getting address:', error);
                return false;
            }
        }

        // Function to show notification
        function showNotification(message, type = 'info') {
            // Remove existing notification
            const existingNotification = document.querySelector('.location-notification');
            if (existingNotification) {
                existingNotification.remove();
            }

            const notification = document.createElement('div');
            notification.className = `location-notification ${type}`;
            notification.innerHTML = `
                <span class="material-icons">${type === 'success' ? 'check_circle' : type === 'error' ? 'error' : 'info'}</span>
                <span>${message}</span>
            `;
            
            document.body.appendChild(notification);
            
            // Auto remove after 4 seconds
            setTimeout(() => {
                if (notification.parentNode) {
                    notification.remove();
                }
            }, 4000);
        }

        // Function to get current location and populate address
        async function getCurrentLocationAndAddress() {
            const locationIcon = document.getElementById('locationIcon');
            const originalText = locationIcon.textContent;
            
            // Show loading state
            locationIcon.textContent = 'location_searching';
            locationIcon.style.opacity = '0.7';
            
            if (!navigator.geolocation) {
                showNotification('Geolocation is not supported by your browser.', 'error');
                locationIcon.textContent = originalText;
                locationIcon.style.opacity = '1';
                return;
            }

            try {
                const position = await new Promise((resolve, reject) => {
                    navigator.geolocation.getCurrentPosition(resolve, reject, {
                        enableHighAccuracy: true,
                        timeout: 10000,
                        maximumAge: 0
                    });
                });

                const { latitude, longitude } = position.coords;
                setLocationFields(latitude, longitude);
                
                // Get address from coordinates
                const success = await getAddressFromCoordinates(latitude, longitude);
                
                if (success) {
                    // Show success feedback
                    locationIcon.textContent = 'check_circle';
                    locationIcon.style.color = '#4CAF50';
                    showNotification('Location detected and address filled automatically!', 'success');
                    setTimeout(() => {
                        locationIcon.textContent = originalText;
                        locationIcon.style.color = '';
                        locationIcon.style.opacity = '1';
                    }, 2000);
                } else {
                    showNotification('Location detected but could not get address details. Please enter manually.', 'error');
                    locationIcon.textContent = originalText;
                    locationIcon.style.opacity = '1';
                }
                
            } catch (error) {
                console.error('Geolocation error:', error);
                let errorMessage = 'Could not get your location. ';
                
                switch(error.code) {
                    case error.PERMISSION_DENIED:
                        errorMessage += 'Please allow location access in your browser settings.';
                        break;
                    case error.POSITION_UNAVAILABLE:
                        errorMessage += 'Location information is unavailable.';
                        break;
                    case error.TIMEOUT:
                        errorMessage += 'Location request timed out.';
                        break;
                    default:
                        errorMessage += 'An unknown error occurred.';
                }
                
                showNotification(errorMessage, 'error');
                locationIcon.textContent = originalText;
                locationIcon.style.opacity = '1';
            }
        }

        // Add click event listener to location icon
        document.addEventListener('DOMContentLoaded', function() {
            const locationIcon = document.getElementById('locationIcon');
            if (locationIcon) {
                locationIcon.addEventListener('click', getCurrentLocationAndAddress);
            }
        });

        function promptForLocation(onSuccess, onError) {
            if (!navigator.geolocation) {
                locationStatus = 'error';
                if (onError) onError('Geolocation is not supported by your browser.');
                return;
            }
            navigator.geolocation.getCurrentPosition(
                function(position) {
                    setLocationFields(position.coords.latitude, position.coords.longitude);
                    if (onSuccess) onSuccess();
                },
                function(error) {
                    locationStatus = 'error';
                    if (onError) onError('We couldn\'t detect your location. Please ensure location services are enabled and permission is granted.');
                },
                { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
            );
        }

        // Prompt for location on page load
        window.addEventListener('DOMContentLoaded', function() {
            promptForLocation();
        });

        async function handleRegistration(event) {
            event.preventDefault();
            const validations = [
                validateVendorName(), validateEmail(), validatePassword(), 
                validateConfirmPassword(), validatePhoneNumber(), validateCity(), 
                validateShopAddress(), validatePincode()
            ];
            if (!validations.every(v => v)) {
                return;
            }

            // Check if location is set or denied
            const latitude = document.getElementById('latitude').value;
            const longitude = document.getElementById('longitude').value;
            if (locationStatus === 'pending') {
                // Still waiting for user to respond to location prompt
                alert('Please allow location access to continue registration.');
                return;
            }
            if (locationStatus === 'error' || !latitude || !longitude) {
                alert('We couldn\'t detect your location. Please ensure location services are enabled and permission is granted.');
                return;
            }

            // Show loading state
            const submitBtn = document.getElementById('submitBtn');
            const loadingSpinner = document.getElementById('loadingSpinner');
            submitBtn.disabled = true;
            loadingSpinner.style.display = 'inline-block';
            const formData = {
                email: document.getElementById('email').value,
                password: document.getElementById('password').value,
                vendor_name: document.getElementById('vendorName').value,
                phone_number: document.getElementById('phoneNumber').value,
                shop_address: document.getElementById('shopAddress').value,
                city: document.getElementById('city').value,
                pincode: document.getElementById('pincode').value,
                latitude: latitude,
                longitude: longitude
            };
            try {
                const response = await fetch('/vendor-register-api/', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-CSRFToken': getCookie('csrftoken')
                    },
                    body: JSON.stringify(formData)
                });
                const data = await response.json();
                if (data.success && data.vendor_email) {
                    const successMessage = document.getElementById('successMessage');
                    successMessage.innerHTML = `
                        <div style="display: flex; align-items: center; justify-content: center; gap: 10px; margin-bottom: 15px;">
                            <span class="material-icons">check_circle</span>
                            <strong>Welcome to PrintMe!</strong>
                        </div>
                        <div style="font-size: 0.9rem; opacity: 0.9;">
                            Your account has been created successfully.<br>
                            Redirecting to setup your pricing in <span id="countdown">3</span> seconds...
                        </div>
                    `;
                    successMessage.style.display = 'block';
                    document.getElementById('vendorRegisterForm').style.display = 'none';
                    let countdown = 3;
                    const countdownElement = document.getElementById('countdown');
                    const timer = setInterval(() => {
                        countdown--;
                        if (countdownElement) {
                            countdownElement.textContent = countdown;
                        }
                        if (countdown <= 0) {
                            clearInterval(timer);
                            window.location.href = `/vendor-pricing/?vendorEmail=${encodeURIComponent(data.vendor_email)}`;
                        }
                    }, 1000);
                } else {
                    throw new Error(data.message || 'Registration failed');
                }
            } catch (error) {
                alert(error.message || 'Registration failed. Please try again.');
            } finally {
                submitBtn.disabled = false;
                loadingSpinner.style.display = 'none';
            }
        }
    </script>
