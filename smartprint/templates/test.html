{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Print Shop Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
        }

        /* Welcome Screen */
        .welcome-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.5s ease, visibility 0.5s ease;
        }

        .welcome-screen.hidden {
            opacity: 0;
            visibility: hidden;
        }

        .logo-container {
            margin-bottom: 40px;
            animation: fadeInDown 0.8s ease;
        }

        .logo {
            width: 80px;
            height: 80px;
            background: white;
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
        }

        .logo svg {
            width: 50px;
            height: 50px;
            fill: #667eea;
        }

        .welcome-content {
            text-align: center;
            color: white;
            animation: fadeInUp 0.8s ease;
        }

        .welcome-content h1 {
            font-size: 32px;
            font-weight: 600;
            margin-bottom: 15px;
        }

        .welcome-content p {
            font-size: 18px;
            opacity: 0.9;
            margin-bottom: 40px;
        }

        /* Loading Animation */
        .loading-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        .loading-dots {
            display: flex;
            gap: 10px;
        }

        .dot {
            width: 12px;
            height: 12px;
            background: white;
            border-radius: 50%;
            animation: bounce 1.4s infinite ease-in-out;
        }

        .dot:nth-child(1) {
            animation-delay: -0.32s;
        }

        .dot:nth-child(2) {
            animation-delay: -0.16s;
        }

        /* Progress Bar */
        .progress-bar {
            width: 250px;
            height: 4px;
            background: rgba(255, 255, 255, 0.3);
            border-radius: 10px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: white;
            border-radius: 10px;
            animation: progress 2s ease-in-out;
        }

        /* Dashboard Content */
        .dashboard {
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.5s ease, visibility 0.5s ease;
            padding: 20px;
        }

        .dashboard.visible {
            opacity: 1;
            visibility: visible;
        }

        /* Animations */
        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes bounce {
            0%, 80%, 100% {
                transform: scale(0);
                opacity: 0.5;
            }
            40% {
                transform: scale(1);
                opacity: 1;
            }
        }

        @keyframes progress {
            0% {
                width: 0%;
            }
            100% {
                width: 100%;
            }
        }

        /* Responsive */
        @media (max-width: 768px) {
            .welcome-content h1 {
                font-size: 24px;
            }
            .welcome-content p {
                font-size: 16px;
            }
            .logo {
                width: 60px;
                height: 60px;
            }
            .logo svg {
                width: 35px;
                height: 35px;
            }
        }
    </style>
</head>
<body>
    <!-- Welcome/Loading Screen -->
    <div class="welcome-screen" id="welcomeScreen">
        <div class="logo-container">
            <div class="logo">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                    <path d="M19 8H5c-1.66 0-3 1.34-3 3v6h4v4h12v-4h4v-6c0-1.66-1.34-3-3-3zm-3 11H8v-5h8v5zm3-7c-.55 0-1-.45-1-1s.45-1 1-1 1 .45 1 1-.45 1-1 1zm-1-9H6v4h12V3z"/>
                </svg>
            </div>
        </div>
        <div class="welcome-content">
            <h1>Welcome to Print Shop Dashboard</h1>
            <p>Preparing your workspace...</p>
            <div class="loading-container">
                <div class="loading-dots">
                    <div class="dot"></div>
                    <div class="dot"></div>
                    <div class="dot"></div>
                </div>
                <div class="progress-bar">
                    <div class="progress-fill"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Your Dashboard Content -->
    <div class="dashboard" id="dashboard">
        {% block content %}
        <!-- Your actual dashboard content goes here -->
        <h1>Dashboard Content</h1>
        <p>This is where your print shop dashboard will be displayed.</p>
        {% endblock %}
    </div>

    <script>
        // Hide welcome screen and show dashboard after 2.5 seconds
        window.addEventListener('load', function() {
            setTimeout(function() {
                const welcomeScreen = document.getElementById('welcomeScreen');
                const dashboard = document.getElementById('dashboard');
                
                welcomeScreen.classList.add('hidden');
                dashboard.classList.add('visible');
            }, 2500);
        });
    </script>
</body>
</html>
